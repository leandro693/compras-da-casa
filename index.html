<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compras da casa</title>
<meta name="theme-color" content="#1E6B52">
<meta name="description" content="Lista de compras da casa com comparador de preços e histórico.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Tokens de cor (claro / escuro) ===== */
:root{
  --bg:#EDF1EE;--surface:#FFFFFF;--surface-2:#F4F7F5;--ink:#1B2523;--muted:#5C6A66;--line:#D5DED9;
  --primary:#1E6B52;--primary-ink:#FFFFFF;--primary-soft:#D8EBE2;--primary-line:#8FC2AC;--mark:#F7CB52;
  --danger:#B23E28;--danger-soft:#FBE4DE;--warn-bg:#FFF2CC;--warn-ink:#684B00;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1412;--surface:#17201C;--surface-2:#1E2924;--ink:#E3ECE8;--muted:#93A39E;--line:#2A3732;
    --primary:#4DB38A;--primary-ink:#0B1A13;--primary-soft:#1C3A2E;--primary-line:#357A60;--mark:#7A5E10;
    --danger:#E8765E;--danger-soft:#3A1F19;--warn-bg:#352B10;--warn-ink:#F2D27A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#17201C;--surface-2:#1E2924;--ink:#E3ECE8;--muted:#93A39E;--line:#2A3732;
  --primary:#4DB38A;--primary-ink:#0B1A13;--primary-soft:#1C3A2E;--primary-line:#357A60;--mark:#7A5E10;
  --danger:#E8765E;--danger-soft:#3A1F19;--warn-bg:#352B10;--warn-ink:#F2D27A;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1;-webkit-tap-highlight-color:transparent}
body.travado{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
img{max-width:100%}
.oculto{display:none!important}

/* ===== Cabeçalho, conteúdo e navegação ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 16px 6px;max-width:680px;margin:0 auto}
.top h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:21px;margin:0;font-weight:800;letter-spacing:-.01em}
.top-dir{display:flex;align-items:center;gap:8px}
.versao{font-size:12px;color:var(--muted)}
.modo-local{font-size:12px;background:var(--warn-bg);color:var(--warn-ink);border-radius:999px;padding:2px 8px}
main{padding:0 16px calc(110px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--primary);font-weight:700}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Resumo da compra (total) ===== */
.hero{background:var(--surface);border-radius:20px;padding:14px 16px 16px;margin:4px 0 10px;border:1px solid var(--line)}
.hero-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px;max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill.vazio-pill{color:var(--muted)}
.total-label{margin-top:12px;color:var(--muted);font-size:14px}
.total{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:clamp(40px,12vw,56px);line-height:1.08;letter-spacing:-.02em}
.total span{background:linear-gradient(transparent 60%,var(--mark) 60%,var(--mark) 92%,transparent 92%);padding:0 6px;margin-left:-6px}
.hero-sub{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:4px}
.hero-sub b{color:var(--ink);font-weight:600}
.orc{margin-top:12px}
.orc-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.orc-bar i{display:block;height:100%;background:var(--primary);transition:width .25s}
.orc.alerta .orc-bar i{background:var(--danger)}
.orc-txt{font-size:13px;color:var(--muted);margin-top:4px}
.orc.alerta .orc-txt{color:var(--danger)}

/* ===== Busca, filtros e chaves ===== */
.busca{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:15;background:var(--bg);padding:6px 0 8px}
.campo{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.campo:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.quebra{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{opacity:.7}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.linha-opcoes{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw input:checked+span{background:var(--primary)}
.sw input:checked+span::after{transform:translateX(16px)}
.sw input:focus-visible+span{outline:3px solid var(--primary);outline-offset:2px}

/* ===== Lista de itens ===== */
.grupo h3{font-size:14px;font-weight:600;color:var(--muted);margin:14px 2px 6px;display:flex;align-items:center;gap:8px}
.lista{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);min-height:62px}
.item:first-child{border-top:0}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);background:transparent;display:grid;place-items:center;padding:0;color:var(--primary-ink)}
.check svg{width:16px;height:16px;opacity:0;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.item.ok .check{background:var(--primary);border-color:var(--primary)}
.item.ok .check svg{opacity:1}
.item.ok .nome{text-decoration:line-through;color:var(--muted)}
.thumb{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line)}
.thumb.sem{display:grid;place-items:center;color:var(--muted);font-size:16px;font-weight:700}
.info{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.nome{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.valor{flex:none;text-align:right;font-weight:600;white-space:nowrap}
.nome-linha{display:flex;align-items:center;gap:6px;min-width:0}
.nome-linha .nome{min-width:0}
.qtd-selo{flex:none;font-size:13px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:999px;padding:1px 8px;white-space:nowrap}
.qtd-selo.sem{color:var(--muted);background:var(--surface-2);font-weight:600}
.qtd-mini{flex:none;display:flex;align-items:center;gap:4px}
.qtd-mini button{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--primary-line);background:var(--primary-soft);color:var(--primary);font-size:20px;font-weight:600;line-height:1;padding:0}
.nota-linha{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.nota-linha.ok .check{background:var(--primary);border-color:var(--primary)}
.nota-linha.ok .check svg{opacity:1}
.nota-linha.fora .info,.nota-linha.fora .valor{opacity:.45}
.fotos-nota{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.fotos-nota div{position:relative}
.fotos-nota img{width:72px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.fotos-nota button{position:absolute;top:-8px;right:-8px;width:28px;height:28px;border-radius:50%;border:0;background:var(--danger);color:#fff;font-size:18px;line-height:1;padding:0}
.qtd-mini span{min-width:50px;text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
.valor.est{color:var(--muted);font-weight:500}
.badge{font-size:12px;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.badge.alerta{background:var(--danger-soft);color:var(--danger)}
.badge.ok{background:var(--primary-soft);color:var(--primary)}
.mini-add{flex:none;border:1.5px solid var(--primary-line);background:var(--primary-soft);color:var(--primary);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.mini-add:disabled{opacity:.55}
.ocultos{margin:10px 2px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
body.mercado .item{min-height:78px;padding:14px}
body.mercado .nome{font-size:19px}
body.mercado .meta{font-size:15px}
body.mercado .check{width:42px;height:42px}
body.mercado .check svg{width:22px;height:22px}
body.mercado .thumb{display:none}
body.mercado .valor{font-size:18px}

/* ===== Botões ===== */
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--primary);color:var(--primary-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.2);display:flex;gap:8px;align-items:center}
.fab svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
body.mercado .fab{padding:18px 24px;font-size:18px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--primary);color:var(--primary-ink)}
.btn.sec{background:var(--primary-soft);color:var(--primary);border:1.5px solid var(--primary-line)}
.btn.sec:active,.mini-add:active{filter:brightness(.92)}
.btn svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.arq{position:relative;overflow:hidden;cursor:pointer}
.arq input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;z-index:2}
.btn.perigo{background:var(--danger);color:#fff}
.btn.texto{background:none;color:var(--primary);padding:8px 4px}
.btn.texto.perigo-txt{color:var(--danger)}
.btn.bloco{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.acoes-fim{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 8px}
.grade-btn{display:flex;flex-wrap:wrap;gap:8px}
.grade-btn .btn{flex:1 1 140px}

/* ===== Cartões, estados vazios e avisos ===== */
.vazio{text-align:center;padding:36px 16px;color:var(--muted)}
.vazio strong{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.cartao h2{font-size:17px;margin:0 0 10px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700}
.cartao .sub{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.cartao.sug{background:var(--warn-bg);border-color:transparent}
.cartao.sug h2{color:var(--warn-ink)}
.cartao.sug .chip{background:var(--surface)}
.aviso{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.aviso.perigo{background:var(--danger-soft);color:var(--danger)}
.aviso.bom{background:var(--primary-soft);color:var(--primary)}
.secao-titulo{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;font-weight:700;margin:16px 2px 8px}
.linha-topo{display:flex;gap:8px;margin:6px 0 4px}
.linha-topo .btn{flex:1}
.contagem{font-size:13px;color:var(--muted);margin:6px 2px}

/* ===== Folhas (bottom sheets) ===== */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(8,18,14,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;max-width:680px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.entra{animation:sobe .2s ease-out}
@keyframes sobe{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.sheet-head h2{margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:20px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.x{flex:none;border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;font-size:22px;line-height:1}
.sheet-body{overflow-y:auto;padding:6px 16px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.rot{font-size:13px;color:var(--muted);margin:14px 0 6px;display:block;font-weight:500}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 18px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{flex:none;width:52px;height:52px;border-radius:12px;border:1.5px solid var(--primary-line);background:var(--primary-soft);color:var(--primary);font-size:24px;font-weight:600}
.stepper input{flex:1;min-width:0;text-align:center;font-size:22px;font-weight:700}
.preco-campo{position:relative}
.preco-campo span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.preco-campo input{padding-left:44px;font-size:22px;font-weight:700}
.resumo-item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:var(--surface-2);border-radius:12px;padding:12px;margin-top:14px;font-size:15px}
.resumo-item strong{text-align:right}
.hist{font-size:14px;color:var(--muted);margin-top:10px}
.hist div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-top:1px dashed var(--line)}
.sheet-acoes{display:grid;gap:10px;margin-top:16px}
.sheet-acoes.duas{grid-template-columns:1fr 1fr}
.cab-prod{display:flex;gap:12px;align-items:center;margin-bottom:4px}
.cab-prod img,.cab-prod .thumb{width:64px;height:64px;border-radius:12px}
.cab-prod .meta{font-size:14px}
.foto-area{display:flex;gap:12px;align-items:center}
.foto-prev{flex:none;width:104px;height:104px;border-radius:14px;object-fit:cover;background:var(--surface-2);border:1px dashed var(--muted);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.foto-btns{display:flex;flex-direction:column;gap:8px;flex:1}
.ia-status{margin-top:10px;font-size:14px;display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--primary);animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
.campo-linha{display:flex;gap:8px}
.campo-linha .campo{flex:1}
.res-linha{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.res-linha:first-child{border-top:0}
.res-linha .info{cursor:default}
.res-linha button.info{cursor:pointer}

/* ===== Modal e aviso rápido ===== */
#modal-root{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(8,18,14,.5);padding:20px}
#modal-root.on{display:grid}
.modal{background:var(--surface);border-radius:18px;padding:18px;width:100%;max-width:380px}
.modal p{margin:0 0 14px;font-size:16px}
.modal h3{margin:0 0 10px;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:19px}
.modal-acoes{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.modal-acoes.col{flex-direction:column}
.modal-acoes.col .btn{width:100%}
#toast{position:fixed;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);display:none;align-items:center;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#toast.on{display:flex}
#toast button{background:none;border:0;color:var(--mark);font-weight:700;padding:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #toast button{color:#F7CB52}}
.carregando{display:grid;place-items:center;gap:14px;padding:80px 0;color:var(--muted)}

/* ===== Relatórios ===== */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat small{display:block;color:var(--muted);font-size:13px}
.stat b{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-size:22px;font-weight:800}
.grafico svg{width:100%;height:auto;display:block;overflow:visible}
.grafico .ax{fill:var(--muted);font-size:10px;font-family:'Figtree',sans-serif}
.grafico .vl{fill:var(--ink);font-size:10px;font-weight:600;font-family:'Figtree',sans-serif}
.barra-h{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;font-size:14px;margin:7px 0}
.barra-h .trilho{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.barra-h .trilho i{display:block;height:100%;border-radius:99px}
.barra-h .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra-h .vl{font-weight:600;white-space:nowrap}
.tabela-wrap{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;font-size:14px}
.tab th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 4px;border-bottom:1px solid var(--line)}
.tab td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tab tr:last-child td{border-bottom:0}
.num{text-align:right!important;white-space:nowrap}
.melhor{color:var(--primary);font-weight:700}
.compra-linha{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.compra-linha:first-of-type{border-top:0}
.compra-linha small{display:block;color:var(--muted);font-size:13px}

/* ===== Ajustes ===== */
.link-app{font-size:13px;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;user-select:all;-webkit-user-select:all;margin-top:8px}

.cor-btn{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.ico-btn{flex:none;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;width:40px;height:40px;display:grid;place-items:center}
.ico-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.log{font-size:13px;color:var(--muted)}
.log div{padding:6px 0;border-top:1px solid var(--line)}
.log div:first-child{border-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.kv span{color:var(--muted)}

#scanner-root{position:fixed;inset:0;z-index:90;background:#000;display:none}

.sc-acoes{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:10px}

function parseNum(s){

/* =========================================================
   BANCO NO APARELHO (IndexedDB)
   ========================================================= */
const BD = {
  db: null,
  /** Abre (ou cria) o banco local com as tabelas do app. */
  abrir(){
    return new Promise((ok, falha) => {
      const r = indexedDB.open('compras-da-casa', 1);
      r.onupgradeneeded = () => { const d = r.result; for (const t of ['produtos', 'compras', 'cfg']) if (!d.objectStoreNames.contains(t)) d.createObjectStore(t); };
      r.onsuccess = () => { this.db = r.result; ok(); };
      r.onerror = () => falha(r.error);
    });
  },
  /** Executa uma operação e resolve quando a transação termina. */
  _op(tabela, modo, fn){
    return new Promise((ok, falha) => {
      const t = this.db.transaction(tabela, modo); const req = fn(t.objectStore(tabela));
      t.oncomplete = () => ok(req ? req.result : undefined); t.onerror = () => falha(t.error); t.onabort = () => falha(t.error);
    });
  },
  todos(tabela){ return this._op(tabela, 'readonly', st => st.getAll()).then(r => r || []); },
  ler(tabela, chave){ return this._op(tabela, 'readonly', st => st.get(chave)); },
  gravar(tabela, chave, valor){ return this._op(tabela, 'readwrite', st => { st.put(valor, chave); }); },
  apagar(tabela, chave){ return this._op(tabela, 'readwrite', st => { st.delete(chave); }); },
};

  async iniciar(){

  async gravarProduto(p){ this.produtos.set(p.id, p); await BD.gravar('produtos', p.id, p); },

/* =========================================================
   LUGARES DE COMPRA (correção de nomes digitados)
   ========================================================= */
/** Distância de edição entre dois textos (para corrigir "Quitando" → "Quitanda"). */
function distancia(a, b){
  const m = a.length, n = b.length; const d = Array.from({length: m + 1}, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 1; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[m][n];
}
/** Aproxima um nome de lugar a um mercado já cadastrado; senão devolve o nome limpo. */
function corrigirLugar(nome){
  const limpo = String(nome || '').replace(/[*_#:]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
  if (!limpo) return null;
  const n = norm(limpo); let melhor = null, dist = 99;
  for (const m of Dados.cfg.mercados) { const d = distancia(n, norm(m)); if (d < dist) { dist = d; melhor = m; } }
  if (melhor && dist <= Math.max(2, Math.floor(n.length * 0.15))) return melhor;
  return limpo.replace(/(^|\s)(\p{L})/gu, (x, e, l) => e + l.toUpperCase());
}

function lerListaLocal(texto){
  const out = []; let lugar = null;
  String(texto).split(/\r?\n/).forEach((bruta, idx) => {
    let l = bruta.trim(); if (!l) return;
    const tit = l.match(/^\*+\s*(.+?)\s*\*+$/) || l.match(/^#+\s*(.+)$/) || l.match(/^([^()\d]{3,40}):$/);
    if (tit) { lugar = corrigirLugar(tit[1]); return; }
    l = l.replace(/^[-•·]\s*/, '');
    const obs = []; l = l.replace(/\(([^)]*)\)/g, (_, x) => { if (x.trim()) obs.push(x.trim()); return ' '; }).replace(/\s+/g, ' ').trim();
    let qtd = null, unidade = 'un';
    const mq = l.match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|pcts?|pacotes?|un|unid\.?|unidades?|cx|caixas?|latas?|garrafas?|bandejas?)?\.?\s+(.+)$/i);
    if (mq) { qtd = parseNum(mq[1]); const u = (mq[2] || '').toLowerCase(); if (u === 'kg') unidade = 'kg'; if (u === 'g') { unidade = 'kg'; qtd = r3(qtd / 1000); } l = mq[3]; }
    if (!l) return;
    const p = acharProdutoPorNome(l);

}
/* =========================================================
   COMPARADOR DE EMBALAGENS (preço por unidade de medida)
   ========================================================= */
/** Medidas de comparação e suas subunidades (fator para a unidade base). */
const MEDIDAS = {
  kg:  {rotulo: 'Peso', base: 'kg', subs: [['g', 0.001], ['kg', 1]], padrao: 'g'},
  L:   {rotulo: 'Volume', base: 'L', subs: [['ml', 0.001], ['L', 1]], padrao: 'ml'},
  m:   {rotulo: 'Metros', base: 'm', subs: [['m', 1]], padrao: 'm'},
  un:  {rotulo: 'Unidades', base: 'un', subs: [['un', 1]], padrao: 'un'},
  lav: {rotulo: 'Lavagens/doses', base: 'lavagem', subs: [['lavagens', 1]], padrao: 'lavagens'},
};
const medidaPadrao = p => (p && MEDIDAS[p.medida]) ? p.medida : (p && p.unidade === 'kg' ? 'kg' : 'un');
/** Calcula preço efetivo da embalagem (com promoção) e preço por unidade de medida. */
function calcularOpcao(o, medida){
  const M = MEDIDAS[medida]; const preco = parseNum(o.preco); const qe = medida === 'lav' ? 1 : (parseNum(o.qtdEmb) || 1);
  const tam = medida === 'un' ? 1 : parseNum(o.tam); const sub = (M.subs.find(s => s[0] === o.sub) || M.subs[M.subs.length - 1])[1];
  if (!(preco > 0) || !(tam > 0) || !(qe > 0)) return null;
  let precoEf = preco, levar = 1;
  if (o.promo === 'leve') { const L = parseNum(o.leveL), P = parseNum(o.leveP); if (L > 0 && P > 0 && P < L) { precoEf = preco * P / L; levar = L; } }
  if (o.promo === 'segunda') { const pct = parseNum(o.segPct); if (pct > 0 && pct <= 100) { precoEf = preco * (2 - pct / 100) / 2; levar = 2; } }
  const total = qe * tam * sub;
  return {precoEf, levar, total, unit: precoEf / total};
}

/** Reduz a imagem para o tamanho máximo informado (JPEG). */
async function comprimir(arquivo, max, qualidade){
  let fonte, w, h;
  try { fonte = await createImageBitmap(arquivo, {imageOrientation:'from-image'}); w = fonte.width; h = fonte.height; }
  catch {
    fonte = await new Promise((ok, falha) => { const im = new Image(); im.onload = () => ok(im); im.onerror = falha; im.src = URL.createObjectURL(arquivo); });
    w = fonte.naturalWidth; h = fonte.naturalHeight;
  }
  const s = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
  cv.getContext('2d').drawImage(fonte, 0, 0, cv.width, cv.height);
  return new Promise(ok => cv.toBlob(b => ok(b), 'image/jpeg', qualidade));
}
const blobParaDataUrl = b => new Promise((ok, falha) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = falha; r.readAsDataURL(b); });
/** Guarda a foto comprimida dentro do próprio produto (banco do aparelho). */
async function salvarFoto(arquivo){
  const b = await comprimir(arquivo, 640, 0.75);
  return {fotoId: null, fotoData: await blobParaDataUrl(b)};
}
/** Endereço seguro da foto do produto. */
function fotoUrl(p){
  if (!p) return null;
  if (p.fotoId && /^[0-9a-f]{32}$/.test(p.fotoId)) return '/_blob/' + p.fotoId;
  if (typeof p.fotoData === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(p.fotoData)) return p.fotoData;
  return null;
}
/** Miniatura do produto (foto ou inicial). */
function thumbHTML(p, nome){
  const u = fotoUrl(p);
  if (u) return `<img class="thumb" src="${esc(u)}" alt="" loading="lazy">`;
  return `<span class="thumb sem" aria-hidden="true">${esc((nome || '?').trim().charAt(0).toUpperCase())}</span>`;
}

const _scripts = {};
/** Carrega uma biblioteca externa uma única vez. */
function carregarScript(src){
  if (!_scripts[src]) _scripts[src] = new Promise((ok, falha) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = ok; s.onerror = () => { delete _scripts[src]; falha(new Error('script')); };
    document.head.appendChild(s);
  });
  return _scripts[src];
}
/** Tenta decodificar o código de barras de uma foto. */
async function decodificarCodigo(arquivo){
  try {
    if ('BarcodeDetector' in window) {
      const bd = new window.BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});
      const bmp = await createImageBitmap(arquivo);
      const r = await bd.detect(bmp);
      const v = r && r[0] && r[0].rawValue;
      if (v && gtinValido(v)) return v;
    }
  } catch {}
  try {
    await carregarScript(URL_ZXING);
    const Z = window.ZXing;
    const hints = new Map();
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.ITF]);
    const reader = new Z.BrowserMultiFormatReader(hints);
    for (const max of [1400, 900]) {
      const b = await comprimir(arquivo, max, 0.92);
      const url = URL.createObjectURL(b);
      try { const r = await reader.decodeFromImageUrl(url); const v = r && r.getText(); if (v && gtinValido(v)) return v; }
      catch {} finally { URL.revokeObjectURL(url); }
    }
  } catch {}
  return null;
}
/** Confere o dígito verificador de códigos EAN-8, UPC-A, EAN-13 e GTIN-14. */
function gtinValido(c){
  if (!/^\d{8}$|^\d{12,14}$/.test(c)) return false;
  const d = c.split('').map(Number); const dv = d.pop(); let soma = 0;
  d.reverse().forEach((n, i) => { soma += n * (i % 2 === 0 ? 3 : 1); });
  return (10 - soma % 10) % 10 === dv;
}
/** Lê o código de barras de uma foto já tirada; oferece digitação se falhar. */
async function lerCodigoDoArquivo(arq){
  if (!arq) return null;
  if (!/^image\//.test(arq.type || '')) { toast('Escolha uma imagem.'); return null; }
  toast('Lendo o código…', null, 8000);
  const cod = await decodificarCodigo(arq);
  esconderToast();
  if (cod) return cod;
  const v = await escolha('Código não reconhecido', 'Tente de novo mais perto, com o código reto e bem iluminado, ou digite os números.', [{v: 'digitar', rotulo: 'Digitar o código', pri: true}]);
  return v === 'digitar' ? digitarCodigo() : null;
}
/** Pede o código de barras digitado. */
async function digitarCodigo(){
  const t = await perguntar('Código de barras', '', {placeholder:'Somente os números', modo:'numeric', ok:'Usar'});
  const d = (t || '').replace(/\D/g, '');
  if (!d) return null;
  if (!/^\d{8,14}$/.test(d)) { toast('O código deve ter de 8 a 14 dígitos.'); return null; }
  if (/^\d{8}$|^\d{12,14}$/.test(d) && !gtinValido(d) && !(await confirmar('O dígito verificador deste código não confere. Usar mesmo assim?', 'Usar'))) return null;
  return d;
}

/** Traduz a resposta de erro do Gemini. */
async function erroGemini(r){
  let m = ''; try { const j = await r.json(); m = (j.error && (j.error.status + ' ' + j.error.message)) || ''; } catch {}
  if (r.status === 400 && /API_KEY|api key/i.test(m)) return new ErroIA('Chave do Gemini inválida. Confira em Ajustes.', 'chave', 'gemini');
  if (r.status === 403) return new ErroIA('O Google recusou a chave. Confira em Ajustes e nas restrições da chave no Google.', 'chave', 'gemini');
  if (r.status === 404) return new ErroIA('Modelo do Gemini indisponível.', 'modelo', 'gemini');
  if (r.status === 429) return new ErroIA('Limite gratuito do Gemini atingido. Tente mais tarde ou preencha à mão.', 'limite', 'gemini');
  return new ErroIA('Gemini indisponível agora. Tente de novo ou preencha à mão.', 'rede', 'gemini');
}
/** Escolhe o modelo Flash gratuito disponível para a chave (o mais novo e estável). */
async function escolherModeloGemini(chave){
  let r;
  try { r = await buscarComLimite(`${GEMINI_URL}?pageSize=1000`, {headers: {'x-goog-api-key': chave}}); }
  catch { throw new ErroIA('Sem conexão com o Google. Tente de novo.', 'rede', 'gemini'); }
  if (!r.ok) throw await erroGemini(r);
  const j = await r.json();
  const nomes = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes('generateContent')).map(m => String(m.name || '').replace(/^models\//, ''))
    .filter(n => /^gemini-[\w.-]*flash/.test(n) && !/tts|live|image|audio|preview|exp|robotics|embedding|thinking|8b/.test(n));
  if (!nomes.length) throw new ErroIA('Nenhum modelo Flash disponível para esta chave.', 'modelo', 'gemini');
  if (nomes.includes('gemini-flash-latest')) return 'gemini-flash-latest';
  const versao = n => { const v = n.match(/^gemini-(\d+(?:\.\d+)?)/); return v ? Number(v[1]) : 0; };
  nomes.sort((a, b) => (/lite/.test(a) - /lite/.test(b)) || (versao(b) - versao(a)) || (a.length - b.length));
  return nomes[0];
}

  if (e instanceof Anthropic.PermissionDeniedError) return new ErroIA('A Anthropic recusou a chave. Confira em Ajustes.', 'chave', 'claude');
  if (e instanceof Anthropic.NotFoundError) return new ErroIA('Modelo Claude Haiku indisponível para esta chave.', 'modelo', 'claude');

/** Gemini: devolve o texto JSON da resposta. */
async function textoGemini(imagens, pedido, ms){

  const chamar = modelo => buscarComLimite(`${GEMINI_URL}/${encodeURIComponent(modelo)}:generateContent`, {

  }, ms);
  const novoModelo = async () => { IA.gemini.modelo = await escolherModeloGemini(IA.gemini.chave); await IA.gravar(); };
  let r;
  try {
    if (!IA.gemini.modelo) await novoModelo();
    r = await chamar(IA.gemini.modelo);
    if (r.status === 404) { await novoModelo(); r = await chamar(IA.gemini.modelo); }
  } catch (e) { throw e instanceof ErroIA ? e : new ErroIA('Sem conexão com o Gemini. Tente de novo ou preencha à mão.', 'rede', 'gemini'); }
  if (!r.ok) throw await erroGemini(r);

/** Claude Haiku: devolve o texto JSON da resposta (formato garantido por esquema). */
async function textoClaude(imagens, pedido, esquema, maxTokens){
  const {Anthropic, cliente} = await clienteClaude(IA.claude.chave);
  const conteudo = [...imagens.map(b64 => ({type: 'image', source: {type: 'base64', media_type: 'image/jpeg', data: b64}})), {type: 'text', text: pedido}];
  let r;

    r = await cliente.messages.create({
      model: MODELO_CLAUDE, max_tokens: maxTokens,
      messages: [{role: 'user', content: conteudo}],
      output_config: {format: {type: 'json_schema', schema: esquema}},
    }, {timeout: 120000});
  } catch (e) { throw erroClaude(Anthropic, e); }
  if (r.stop_reason === 'refusal') throw new ErroIA('O Claude não quis ler esta foto. Tente outra.', 'formato', 'claude');

/** Data no formato AAAA-MM-DD (horário local). */

function dataNota(s){
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return isoData(new Date());
  const d = new Date(+m[1], +m[2] - 1, +m[3], 12);
  const ok = d.getMonth() === +m[2] - 1 && d.getFullYear() >= 2015 && d.getTime() <= Date.now() + 864e5;
  return isoData(ok ? d : new Date());
}

  if (!provedor) throw new ErroIA('Para ler a nota, configure uma chave de IA (Gemini ou Claude) em Ajustes.', 'sem-chave');

    if (!x || typeof x !== 'object') continue;
    const numero = Number.isInteger(parseNum(x.numero)) ? parseNum(x.numero) : null;

    if (!(qtd > 0)) qtd = unit > 0 && total > 0 ? total / unit : 1;

    const descricao = textoExterno(x.descricao, 80, 'nota');
    const nome = textoExterno(x.nome, 60, 'nota') || capitalizar(descricao.toLowerCase()).slice(0, 60);

      total: total > 0 ? r2(total) : 0, nome: capitalizar(nome), marca: textoExterno(x.marca, 40, 'nota'), tamanho: textoExterno(x.tamanho, 20, 'nota'), categoriaId: cat ? cat.id : null});

/** Produto já cadastrado que corresponde à linha da nota (pelo código de barras ou pelo nome). */

  const p = n && ps.find(x => norm(x.nome) === n && (!l.marca || !x.marca || norm(x.marca) === norm(l.marca)));

        ${st.fotos.length ? `<div class="fotos-nota">${st.fotos.map((f, i) => `<div><img src="${esc(f.url)}" alt="Parte ${i + 1} da nota"><button type="button" data-a="nota-tirar-foto" data-i="${i}" aria-label="Remover parte ${i + 1}">×</button></div>`).join('')}</div>` : ''}
        ${st.fotos.length < MAX_FOTOS_NOTA ? `<div class="grade-btn">${botaoArquivo('nota-camera', st.fotos.length ? 'Tirar mais uma' : 'Tirar foto', {camera: true, icone: 'camera'})}${botaoArquivo('nota-galeria', 'Da galeria', {icone: 'galeria'})}</div>` : ''}
        ${e ? `<div class="ia-status perigo-txt" role="status" style="flex-wrap:wrap"><span style="flex:1 1 100%">${esc(e.texto)}</span>${e.repetir ? `<button class="btn texto" data-a="nota-ler" data-p="${esc(e.repetir)}">Tentar de novo</button>` : ''}${e.outro ? `<button class="btn texto" data-a="nota-ler" data-p="${esc(e.outro)}">Tentar com o ${esc(NOME_IA[e.outro])}</button>` : ''}</div>` : ''}
        <div class="sheet-acoes"><button class="btn pri" data-a="nota-ler" ${st.fotos.length ? '' : 'disabled'}>Ler nota${st.fotos.length > 1 ? ` (${st.fotos.length} fotos)` : ''}</button></div>`;
    },
    acoes: {
      'nota-camera'(el, a){ adicionarFoto(a); },
      'nota-galeria'(el, a){ adicionarFoto(a); },
      'nota-tirar-foto'(b){ const f = st.fotos.splice(Number(b.dataset.i), 1)[0]; if (f) URL.revokeObjectURL(f.url); mostrarSheet(); },
      async 'nota-ler'(b){
        if (!st.fotos.length || st.lendo) return;
        const p = NOME_IA[b.dataset.p] ? b.dataset.p : IA.atual(); if (!p) return;
        st.lendo = p; st.erro = null; mostrarSheet();
        try {
          const dados = await lerNotaComIA(st.fotos.map(f => f.arq), p);
          st.lendo = null;
          if (topoSheet() !== s) return;
          fecharSheet(); abrirConferirNota(dados);
        } catch (e) {
          st.lendo = null;
          const err = e instanceof ErroIA ? e : new ErroIA('Não foi possível ler a nota. Tente de novo.', 'rede', p);
          st.erro = {texto: err.message, repetir: ['rede', 'limite', 'formato'].includes(err.codigo) ? (err.provedor || p) : null, outro: IA.outro(err.provedor || p)};
          if (topoSheet() === s) mostrarSheet();
        }
      },
    },
    aoFechar(){ st.fotos.forEach(f => URL.revokeObjectURL(f.url)); },
  };
  function adicionarFoto(a){
    if (!/^image\//.test(a.type || '')) return toast('Escolha uma imagem.');
    if (st.fotos.length >= MAX_FOTOS_NOTA) return;
    st.fotos.push({arq: a, url: URL.createObjectURL(a)}); st.erro = null; mostrarSheet();
  }
  abrirSheet(s);
}

/** FOLHA: conferência da nota antes de salvar. */
function abrirConferirNota(dados){
  const loja = dados.loja && dados.loja === dados.loja.toUpperCase() ? dados.loja.toLowerCase() : dados.loja;
  const st = {loja: corrigirLugar(loja) || '', data: dataNota(dados.data), totalNota: dados.total, tirarDaLista: true,
    itens: dados.itens.map(l => Object.assign({}, l, {incluir: true, alvo: casarLinhaNota(l)}))};
  const soma = () => r2(st.itens.filter(l => l.incluir).reduce((t, l) => t + (l.total || 0), 0));
  const naLista = () => { const c = compraAberta(); if (!c) return 0; const pids = new Set(st.itens.filter(l => l.incluir && l.alvo).map(l => l.alvo)); return c.itens.filter(i => pids.has(i.pid)).length; };
  const s = {
    titulo: 'Conferir nota',
    html(){
      const total = soma(); const inc = st.itens.filter(l => l.incluir).length;
      const dif = st.totalNota > 0 ? r2(total - st.totalNota) : 0;
      const rep = notaRepetida(corrigirLugar(st.loja), st.data, total);
      const nl = naLista();
      const linhas = st.itens.map((l, i) => {
        const p = l.alvo ? Dados.produtos.get(l.alvo) : null; const nome = p ? p.nome : l.nome;
        const preco = l.qtd > 0 ? l.total / l.qtd : 0;
        return `<div class="nota-linha${l.incluir ? ' ok' : ' fora'}"><button class="check" data-a="nota-incluir" data-i="${i}" aria-label="${l.incluir ? 'Não incluir' : 'Incluir'}: ${esc(nome)}">${svgCheck}</button>
          <button class="info" data-a="nota-item" data-i="${i}"><div class="nome-linha"><div class="nome">${esc(nome)}</div>${p ? '<span class="badge ok">Cadastrado</span>' : '<span class="badge">Novo</span>'}</div><div class="meta"><span>${esc(l.descricao)}</span><span>${esc(fmtQtd(l.qtd, l.unidade))} × ${fmt(preco)}</span></div></button>
          <div class="valor">${fmt(l.total)}</div></div>`;
      }).join('');
      return `<label class="rot" for="nLoja" style="margin-top:0">Lugar</label><input id="nLoja" class="campo" value="${esc(st.loja)}" maxlength="40" placeholder="Nome do mercado" autocomplete="off">
        ${Dados.cfg.mercados.length ? `<div class="chips quebra" style="margin-top:6px">${Dados.cfg.mercados.map(m => `<button type="button" class="chip" data-a="nota-lugar" data-v="${esc(m)}" aria-pressed="${st.loja === m}">${esc(m)}</button>`).join('')}</div>` : ''}
        <label class="rot" for="nData">Data da compra</label><input id="nData" class="campo" type="date" value="${esc(st.data)}">
        <div class="resumo-item"><span>Itens incluídos</span><strong>${inc} de ${st.itens.length}</strong><span>Soma dos itens</span><strong>${fmt(total)}</strong>${st.totalNota > 0 ? `<span>Total da nota</span><strong>${fmt(st.totalNota)}</strong>` : ''}</div>
        ${Math.abs(dif) > 0.05 ? `<div class="aviso">A soma dos itens está ${fmt(Math.abs(dif))} ${dif > 0 ? 'acima' : 'abaixo'} do total da nota. Confira as linhas antes de salvar.</div>` : ''}
        ${rep ? `<div class="aviso perigo">Parece que esta nota já foi salva (${esc(rep.mercado)}, ${fmtData(rep.finalizadaEm)}, ${fmt(rep.total)}).</div>` : ''}
        <div class="contagem" style="margin-top:12px">Toque num item para corrigir ou ligar a um produto cadastrado.</div>
        <div>${linhas}</div>
        ${nl ? `<div class="cfg-linha" style="margin-top:12px"><label class="sw" style="flex:1;justify-content:space-between">Tirar da lista ${nl === 1 ? 'o item que veio' : `os ${nl} itens que vieram`} na nota<input type="checkbox" id="nTirar" ${st.tirarDaLista ? 'checked' : ''}><span></span></label></div>` : ''}
        <div class="sheet-acoes"><button class="btn pri" data-a="nota-salvar">Salvar compra (${fmt(total)})</button></div>`;
    },
    montar(el){
      el.querySelector('#nLoja').addEventListener('input', e => { st.loja = e.target.value; });
      el.querySelector('#nData').addEventListener('change', e => { st.data = dataNota(e.target.value); mostrarSheet(); });
      const t = el.querySelector('#nTirar'); if (t) t.addEventListener('change', () => { st.tirarDaLista = t.checked; });
    },
    acoes: {
      'nota-lugar'(b){ st.loja = b.dataset.v; mostrarSheet(); },
      'nota-incluir'(b){ const l = st.itens[Number(b.dataset.i)]; if (l) { l.incluir = !l.incluir; mostrarSheet(); } },
      'nota-item'(b){ abrirItemNota(st.itens[Number(b.dataset.i)]); },

    },
  };
  abrirSheet(s);
}

        ${p ? `<span class="rot">Produto cadastrado</span><div class="cab-prod">${thumbHTML(p, p.nome)}<div><div class="nome">${esc(p.nome)}</div><div class="meta">${esc([p.marca, p.tamanho].filter(Boolean).join(' ') || 'Sem marca no cadastro')}</div></div></div>

            <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:10px"><div><label class="rot" for="niMarca">Marca</label><input id="niMarca" class="campo" data-l="marca" value="${esc(l.marca)}" maxlength="40" autocomplete="off"></div><div><label class="rot" for="niTam">Tamanho</label><input id="niTam" class="campo" data-l="tamanho" value="${esc(l.tamanho)}" maxlength="20" autocomplete="off"></div></div>
            <span class="rot">Categoria</span><div class="chips quebra">${Dados.cfg.categorias.map(c => `<button type="button" class="chip" data-a="ni-cat" data-v="${esc(c.id)}" aria-pressed="${l.categoriaId === c.id}"><i class="dot" style="background:${esc(c.cor)}"></i>${esc(c.nome)}</button>`).join('')}</div>`}
        <label class="rot" for="niBusca">${p ? 'Trocar por outro produto cadastrado' : 'Ou ligar a um produto cadastrado'}</label><input id="niBusca" class="campo" type="search" value="${esc(q)}" placeholder="Buscar no catálogo" autocomplete="off">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label class="rot" for="niQtd">Quantidade${l.unidade === 'kg' ? ' (kg)' : ''}</label><input id="niQtd" class="campo" inputmode="decimal" data-l="qtd" value="${esc(String(l.qtd).replace('.', ','))}" autocomplete="off"></div><div><label class="rot" for="niTotal">Total pago (R$)</label><input id="niTotal" class="campo" inputmode="decimal" data-l="total" value="${esc(fmtNum2(l.total))}" autocomplete="off"></div></div>

        else l[k] = i.value;

}

/** Grava a nota: produtos novos, códigos, lugar, compra no histórico e retirada da lista. */
async function salvarNota(st){
  const linhas = st.itens.filter(l => l.incluir);
  if (!linhas.length) return toast('Inclua ao menos um item.');
  if (linhas.some(l => !(l.qtd > 0))) return toast('Há item sem quantidade. Toque nele para corrigir.');
  if (linhas.some(l => !l.alvo && !String(l.nome || '').trim())) return toast('Há produto novo sem nome. Toque nele para corrigir.');
  const lugar = corrigirLugar(st.loja);
  if (!lugar) return toast('Informe o lugar da compra.');
  const total = r2(linhas.reduce((t, l) => t + (l.total || 0), 0));
  const rep = notaRepetida(lugar, st.data, total);
  if (rep && !(await confirmar(`Esta nota parece já ter sido salva (${rep.mercado}, ${fmtData(rep.finalizadaEm)}, ${fmt(rep.total)}). Salvar de novo?`, 'Salvar mesmo assim'))) return;
  const [y, m, d] = st.data.split('-').map(Number); const quando = new Date(y, m - 1, d, 12).getTime();
  const codigoLivre = cod => cod && ![...Dados.produtos.values()].some(x => x.codigo === cod);
  const novos = new Map(), porPid = new Map();
  for (const l of linhas) {
    let p = l.alvo ? Dados.produtos.get(l.alvo) : null;
    if (p) {
      if (l.ean && !p.codigo && codigoLivre(l.ean)) { p = Object.assign(clone(p), {codigo: l.ean}); Dados.salvarProduto(p); }
    } else {
      const chave = l.ean || norm(l.nome) + '|' + norm(l.marca);
      p = novos.get(chave);
      if (!p) {
        const tam = String(l.tamanho || '').trim();
        p = {id: novoId(), nome: capitalizar(String(l.nome).trim()).slice(0, 60), marca: String(l.marca || '').trim().slice(0, 40), tamanho: tam.slice(0, 20), unidade: l.unidade === 'kg' ? 'kg' : 'un',
          categoriaId: catSeExiste(l.categoriaId), codigo: codigoLivre(l.ean) ? l.ean : '', fotoId: null, fotoData: null, criadoEm: Date.now()};
        const med = l.unidade === 'kg' ? 'kg' : medidaDoTamanho(tam); if (med) p.medida = med;
        Dados.salvarProduto(p); novos.set(chave, p);
      }
    }
    const g = porPid.get(p.id) || {p, qtd: 0, total: 0};
    g.p = p; g.qtd += l.qtd; g.total += l.total || 0; porPid.set(p.id, g);
  }
  const itens = [...porPid.values()].map(g => ({pid: g.p.id, nome: g.p.nome, marca: g.p.marca || '', categoriaId: catDoProduto(g.p), unidade: g.p.unidade || 'un', qtd: r3(g.qtd), preco: r2(g.total / g.qtd),
    comprado: true, compradoEm: quando, local: lugar, obs: null, sugestao: null}));
  Dados.salvarCompra({id: novoId(), status: 'finalizada', mercado: lugar, orcamento: null, criadaEm: quando, finalizadaEm: quando, total, itens, origem: 'nota'});
  if (!Dados.cfg.mercados.includes(lugar)) Dados.salvarCfg(x => { x.mercados.push(lugar); x.mercados.sort((a, b) => a.localeCompare(b, 'pt-BR')); });
  let tirados = 0; const ab = compraAberta();
  if (st.tirarDaLista && ab) { const c = clone(ab); const antes = c.itens.length; c.itens = c.itens.filter(i => !porPid.has(i.pid)); tirados = antes - c.itens.length; if (tirados) Dados.salvarCompra(c); }
  fecharTodasSheets();
  toast(`Nota salva: ${itens.length} ${itens.length === 1 ? 'produto' : 'produtos'}, ${fmt(total)} em ${lugar}` + (novos.size ? `. ${novos.size} ${novos.size === 1 ? 'cadastrado' : 'cadastrados'}` : '') + (tirados ? `. ${tirados} ${tirados === 1 ? 'saiu' : 'saíram'} da lista` : ''), null, 6000);
}

/* =========================================================
   LEITOR AO VIVO (aponte a câmera para o código)
   ========================================================= */
/** Abre a câmera em tela cheia e resolve com o código lido, digitado ou null. */
function lerCodigoAoVivo(){
  return new Promise(resolve => {
    const root = document.getElementById('scanner-root');
    root.innerHTML = `<video id="scVideo" playsinline muted autoplay></video><div class="sc-mira" aria-hidden="true"></div>
      <div class="sc-topo"><span id="scMsg">Aponte para o código de barras</span></div>
      <div class="sc-acoes">${botaoArquivo('sc-foto', 'Tirar foto do código', {camera: true, icone: 'camera'})}<button class="btn sec" id="scDigitar">${ICONES.teclado}Digitar código</button><button class="btn pri" id="scFechar">Cancelar</button></div>`;
    root.classList.add('on'); document.body.classList.add('travado');
    const video = root.querySelector('#scVideo'); let stream = null, laco = null, zx = null, fim = false;
    /** Encerra câmera, leitura e tela. */
    const terminar = (cod, resolver = true) => {
      if (fim) return; fim = true;
      clearInterval(laco); try { zx && zx.reset(); } catch {}
      if (stream) stream.getTracks().forEach(t => t.stop());
      root.classList.remove('on'); root.innerHTML = '';
      if (!document.querySelector('#sheet-root.on')) document.body.classList.remove('travado');
      if (cod && navigator.vibrate) navigator.vibrate(80);
      if (resolver) resolve(cod || null);
    };
    const aceitar = v => { if (v && gtinValido(String(v))) terminar(String(v)); };
    root.querySelector('#scFechar').onclick = () => terminar(null);
    root.querySelector('#scDigitar').onclick = async () => { terminar(null, false); resolve(await digitarCodigo()); };
    root.querySelector('input[data-arq="sc-foto"]').addEventListener('change', async e => {
      const arq = e.target.files && e.target.files[0]; e.stopPropagation(); if (!arq) return;
      terminar(null, false); resolve(await lerCodigoDoArquivo(arq));
    });
    const msg = t => { const m = root.querySelector('#scMsg'); if (m) m.textContent = t; };
    (async () => {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg('Câmera ao vivo indisponível. Use Tirar foto ou Digitar.'); return; }
      try {
        let nativo = null;
        if ('BarcodeDetector' in window) {
          try {
            const fmts = await window.BarcodeDetector.getSupportedFormats();
            const quero = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf'].filter(f => fmts.includes(f));
            if (quero.length) nativo = new window.BarcodeDetector({formats: quero});
          } catch {}
        }
        if (nativo) {
          stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}}, audio: false});
          if (fim) { stream.getTracks().forEach(t => t.stop()); return; }
          video.srcObject = stream; await video.play().catch(() => {});
          laco = setInterval(async () => { if (fim || video.readyState < 2) return; try { const r = await nativo.detect(video); if (r && r[0]) aceitar(r[0].rawValue); } catch {} }, 180);
        } else {
          msg('Carregando leitor…');
          await carregarScript(URL_ZXING); if (fim) return;
          const Z = window.ZXing; const hints = new Map();
          hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E, Z.BarcodeFormat.ITF]);
          zx = new Z.BrowserMultiFormatReader(hints);
          msg('Aponte para o código de barras');
          await zx.decodeFromConstraints({video: {facingMode: {ideal: 'environment'}}, audio: false}, video, r => { if (r) aceitar(r.getText()); });
        }
      } catch (e) {
        msg(e && e.name === 'NotAllowedError' ? 'Permissão de câmera negada. Libere nas configurações do Chrome ou use Digitar.' : 'Não foi possível abrir a câmera. Use Tirar foto ou Digitar.');
      }
    })();
  });
}

/** Botão que é o próprio campo de arquivo (não depende de clique programático). */
function botaoArquivo(acao, rotulo, {camera = false, accept = 'image/*', classe = 'sec', icone = 'camera', estilo = ''} = {}){
  return `<label class="btn ${classe} arq" data-arq-label style="${estilo}">${ICONES[icone] || ''}<span>${esc(rotulo)}</span><input type="file" accept="${esc(accept)}" ${camera ? 'capture="environment"' : ''} data-arq="${esc(acao)}" aria-label="${esc(rotulo)}"></label>`;
}
let _arqTimer = null;
/** Se nada abrir alguns segundos após o toque, avisa sobre as alternativas. */
function vigiarSeletor(){
  clearTimeout(_arqTimer);
  _arqTimer = setTimeout(() => {
    if (document.visibilityState === 'visible' && document.hasFocus()) toast('A câmera não abriu. Confira a permissão de câmera do Chrome para este app ou use Digitar código.', null, 6000);

/* =========================================================
   REGRAS DE NEGÓCIO (compra aberta, preços, totais, sugestões)
   ========================================================= */
const categoria = id => Dados.cfg.categorias.find(c => c.id === id) || SEM_CAT;
const catDoProduto = p => (p && p.categoriaId && Dados.cfg.categorias.some(c => c.id === p.categoriaId)) ? p.categoriaId : null;
/** Categoria atual de um item (usa o cadastro atual do produto). */
function catIdItem(it){ const p = Dados.produtos.get(it.pid); if (p) return catDoProduto(p); return Dados.cfg.categorias.some(c => c.id === it.categoriaId) ? it.categoriaId : null; }
const nomeItem = it => Dados.produtos.get(it.pid)?.nome || it.nome || 'Produto';
const unidadeItem = it => Dados.produtos.get(it.pid)?.unidade || it.unidade || 'un';
/** Texto de busca de um produto. */
function textoBusca(p, it){
  const base = p || {nome: it?.nome, marca: it?.marca};
  const cid = p ? catDoProduto(p) : catIdItem(it);
  return norm([base.nome, base.marca, base.tamanho, categoria(cid).nome, base.codigo].join(' '));
}
/** Confere se todos os termos digitados aparecem no texto. */
function casa(texto, q){ const t = norm(q).split(/\s+/).filter(Boolean); return t.every(x => texto.includes(x)); }

function compraAberta(){ for (const c of Dados.compras.values()) if (c.status === 'aberta') return c; return null; }
/** Cópia editável da compra aberta (cria uma nova se não houver). */
function editarCompraAberta(){ const c = compraAberta(); return c ? clone(c) : {id: novoId(), status:'aberta', mercado:'', orcamento:null, criadaEm: Date.now(), itens: []}; }
const comprasFeitas = () => [...Dados.compras.values()].filter(c => c.status === 'finalizada').sort((a, b) => b.finalizadaEm - a.finalizadaEm);

/** Adiciona produto na lista atual. */
function addNaLista(pid, qtd, extra = {}){
  const p = Dados.produtos.get(pid); if (!p) return false;
  const c = editarCompraAberta();
  if (c.itens.some(i => i.pid === pid)) return false;
  c.itens.push({pid, nome: p.nome, marca: p.marca || '', categoriaId: catDoProduto(p), unidade: p.unidade || 'un', qtd: qtd === undefined ? 1 : qtd, preco: null, comprado: false, obs: extra.obs || null, sugestao: extra.sugestao || null});

}
/** Passo do ajuste de quantidade (kg anda de 0,1 em 0,1). */
const passoQtd = un => un === 'kg' ? 0.1 : 1;
/** Soma ou tira um passo da quantidade a comprar de um item da lista (mínimo de um passo). */
function ajustarQtdLista(pid, sinal){
  const c = editarCompraAberta(); const it = c.itens.find(i => i.pid === pid); if (!it) return;
  const passo = passoQtd(unidadeItem(it));
  it.qtd = r3(Math.max(passo, (it.qtd > 0 ? it.qtd : 0) + sinal * passo));
  Dados.salvarCompra(c);
}
/** Seletor − quantidade + de um item que já está na lista. */
function seletorQtdHTML(it){

  return `<div class="qtd-mini" role="group" aria-label="Quantidade de ${nome}"><button type="button" data-a="qtd-menos" data-pid="${esc(it.pid)}" aria-label="Diminuir ${nome}">−</button><span>${it.qtd > 0 ? esc(fmtQtd(it.qtd, unidadeItem(it))) : '?'}</span><button type="button" data-a="qtd-mais" data-pid="${esc(it.pid)}" aria-label="Aumentar ${nome}">+</button></div>`;
}

let IDX = null;
/** Índice de preços pagos por produto (recalculado a cada mudança). */
function indice(){
  if (IDX) return IDX;
  const hist = new Map(), vezes = new Map();
  for (const c of Dados.compras.values()) for (const it of c.itens || []) {
    if (!it.comprado || !(it.preco > 0)) continue;
    const a = hist.get(it.pid) || [];
    a.push({data: it.compradoEm || c.finalizadaEm || c.criadaEm, preco: it.preco, qtd: it.qtd, mercado: it.local || c.mercado || '', compraId: c.id, finalizada: c.status === 'finalizada'});
    hist.set(it.pid, a);
    if (c.status === 'finalizada') vezes.set(it.pid, (vezes.get(it.pid) || 0) + 1);
  }
  for (const a of hist.values()) a.sort((x, y) => x.data - y.data);
  IDX = {hist, vezes};
  return IDX;
}
/** Último preço pago (ignorando a compra informada). */
function ultimoPreco(pid, excetoCompra){ const a = (indice().hist.get(pid) || []).filter(x => x.compraId !== excetoCompra); return a.length ? a[a.length - 1].preco : null; }
/** Média dos últimos 5 preços pagos (mínimo de 2 registros). */
function mediaPreco(pid, excetoCompra){
  const a = (indice().hist.get(pid) || []).filter(x => x.compraId !== excetoCompra).slice(-5);
  if (a.length < 2) return null;
  return a.reduce((s, x) => s + x.preco, 0) / a.length;
}
/** Alerta quando o preço está acima da média em mais que o limite definido. */
function alertaPreco(pid, preco, compraId){
  const m = mediaPreco(pid, compraId);
  if (!m || !(preco > 0)) return null;
  const pct = (preco - m) / m * 100;
  return pct >= (Dados.cfg.alertaPct || 15) ? {pct, media: m} : null;
}
/** Totais da compra: gasto no carrinho e previsão com preços de referência. */
function totais(c){
  let gasto = 0, previsto = 0, comprados = 0;
  for (const it of (c && c.itens) || []) {
    const ref = it.comprado ? it.preco : (it.preco || ultimoPreco(it.pid, c.id) || 0);
    const v = (it.comprado ? (it.qtd || 0) : (it.qtd || 1)) * (ref || 0);
    if (it.comprado) { gasto += v; comprados++; }
    previsto += v;
  }
  return {gasto: r2(gasto), previsto: r2(previsto), comprados, total: ((c && c.itens) || []).length};
}
/** Produtos que provavelmente estão acabando, pelo intervalo médio entre compras. */
function sugestoes(){
  const ab = compraAberta(); const naLista = new Set(((ab && ab.itens) || []).map(i => i.pid));
  const agora = Date.now(), DIA = 86400000, out = [];
  for (const [pid, arr] of indice().hist) {
    if (naLista.has(pid) || !Dados.produtos.has(pid)) continue;
    const dias = [...new Set(arr.filter(x => x.finalizada).map(x => Math.floor(x.data / DIA)))].sort((a, b) => a - b);
    if (dias.length < 2) continue;
    const media = (dias[dias.length - 1] - dias[0]) / (dias.length - 1);
    if (media < 1) continue;
    const desde = Math.floor(agora / DIA) - dias[dias.length - 1];
    const r = desde / media;
    if (r >= 0.9) out.push({pid, r, media: Math.round(media)});
  }
  return out.sort((a, b) => b.r - a.r).slice(0, 8);
}
/** Mais comprados primeiro, depois por nome. */
function ordenarProdutos(lista){
  const v = indice().vezes;
  return lista.sort((a, b) => (v.get(b.id) || 0) - (v.get(a.id) || 0) || a.nome.localeCompare(b.nome, 'pt-BR'));
}

<script>

}

/* =========================================================

   ========================================================= */
const pilha = [];
/** Abre uma folha: {titulo, html(), montar(el), acoes{}, aoFechar()}. */
function abrirSheet(s){ pilha.push(s); s._nova = true; mostrarSheet(); }

function mostrarSheet(){

    if (!vis.length && !q) h += `<div class="vazio"><strong>${UI.filtroCat ? 'Nada pendente nesta categoria' : 'Tudo comprado'}</strong>${UI.filtroCat ? '' : 'Finalize a compra para guardar no histórico.'}</div>`;

    if (ocultos) h += `<div class="ocultos">${ocultos} ${ocultos === 1 ? 'item comprado oculto' : 'itens comprados ocultos'} <button class="btn texto" data-a="mostrar-comprados">Mostrar</button></div>`;
  }
  // busca também no catálogo
  if (q) {
    const naLista = new Set(itens.map(i => i.pid));
    const cat = ordenarProdutos([...Dados.produtos.values()].filter(p => !naLista.has(p.id) && casa(textoBusca(p), q))).slice(0, 8);
    h += `<section class="cartao"><h2>Do seu catálogo</h2>${cat.length ? cat.map(p => `<div class="res-linha">${thumbHTML(p, p.nome)}<div class="info"><div class="nome">${esc(p.nome)}</div><div class="meta"><span>${esc([p.marca, p.tamanho].filter(Boolean).join(' '))}</span><span>${esc(categoria(catDoProduto(p)).nome)}</span></div></div><button class="mini-add" data-a="add-lista" data-pid="${esc(p.id)}">Adicionar</button></div>`).join('') : '<div class="contagem">Nenhum produto cadastrado com esse nome.</div>'}
    <div style="margin-top:10px"><button class="btn sec bloco" data-a="novo-produto-busca">Cadastrar “${esc(q)}”</button></div></section>`;
  }
  if (itens.length) {
    const ult = comprasFeitas()[0];
    h += `<div class="acoes-fim">${ult ? `<button class="btn sec" data-a="repetir" data-id="${esc(ult.id)}">Repetir última compra</button>` : `<button class="btn sec" data-a="colar">Colar lista</button>`}<button class="btn pri" data-a="finalizar">Finalizar compra</button></div>`;
  }
  h += `<button class="fab" data-a="adicionar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Adicionar</button>`;
  return h;
}
/** Garante o lugar atual antes de colocar algo no carrinho. */
function exigirLugar(fn){
  const c = compraAberta();
  if (c && c.mercado) return fn();
  toast('Onde você está comprando agora?');
  abrirMercado(fn);
}

/* =========================================================
   FOLHA: ITEM DA LISTA (quantidade, preço, observação, total ao vivo)
   ========================================================= */
function abrirItem(pid, focarPreco){
  const c0 = compraAberta(); const it0 = c0 && c0.itens.find(i => i.pid === pid); if (!it0) return;
  const p = Dados.produtos.get(pid); const nome = nomeItem(it0); const un = unidadeItem(it0); const passo = un === 'kg' ? 0.1 : 1;
  const ult = ultimoPreco(pid, c0.id);
  let qtd = it0.qtd > 0 ? it0.qtd : NaN;
  let precoTxt = it0.preco > 0 ? fmtNum2(it0.preco) : (ult ? fmtNum2(ult) : '');
  let obs = it0.obs || '';
  let sugestao = it0.sugestao || '';
  const hist = (indice().hist.get(pid) || []).filter(x => x.compraId !== c0.id).slice(-3).reverse();
  /** Subtotal, total do carrinho e alertas, atualizados enquanto digita. */
  const resumo = () => {
    const pr = parseNum(precoTxt); const c = compraAberta(); if (!c) return '';
    const t = totais(c); const at = c.itens.find(i => i.pid === pid);
    const contrib = at && at.comprado ? at.qtd * at.preco : 0;
    const sub = qtd > 0 && pr > 0 ? r2(qtd * pr) : 0; const novo = t.gasto - contrib + sub;
    const al = alertaPreco(pid, pr, c.id);
    let h = `<div class="resumo-item"><span>Subtotal</span><strong>${fmt(sub)}</strong><span>Carrinho com este item</span><strong>${fmt(novo)}</strong></div>`;
    if (al) h += `<div class="aviso perigo">Preço ${Math.round(al.pct)}% acima da sua média de ${fmt(al.media)}.</div>`;
    if (c.orcamento > 0 && novo > c.orcamento) h += `<div class="aviso">Com este item o carrinho passa ${fmt(novo - c.orcamento)} do orçamento.</div>`;
    return h;
  };
  const s = {
    titulo: nome,
    html(){
      const c = compraAberta(); const at = c?.itens.find(i => i.pid === pid) || it0;
      const lugares = [...new Set([...Dados.cfg.mercados, sugestao].filter(Boolean))];
      return `<div class="cab-prod">${thumbHTML(p, nome)}<div><div class="meta">${esc([p?.marca, p?.tamanho].filter(Boolean).join(' ') || 'Sem marca no cadastro')}</div><div class="meta">${esc(categoria(catIdItem(at)).nome)}${c && c.mercado ? ' em ' + esc(c.mercado) : ''}</div></div></div>
      ${obs ? `<div class="aviso" style="margin-top:8px">${esc(obs)}</div>` : ''}
      <button class="btn sec bloco" style="margin-top:12px" data-a="comparar">Comparar opções de embalagem</button>
      <label class="rot" for="iQtd">Quantidade (${un === 'kg' ? 'kg' : 'unidades'})</label>
      <div class="stepper"><button type="button" data-a="menos" aria-label="Diminuir">−</button><input id="iQtd" class="campo" inputmode="decimal" placeholder="definir" value="${qtd > 0 ? esc(String(qtd).replace('.', ',')) : ''}" autocomplete="off"><button type="button" data-a="mais" aria-label="Aumentar">+</button></div>
      <label class="rot" for="iPreco">Preço ${un === 'kg' ? 'por kg' : 'unitário'}${ult ? ` <span>(último: ${fmt(ult)})</span>` : ''}</label>
      <div class="preco-campo"><span>R$</span><input id="iPreco" class="campo" inputmode="decimal" placeholder="0,00" value="${esc(precoTxt)}" autocomplete="off"></div>
      <div id="iResumo">${resumo()}</div>
      <label class="rot" for="iObs">Observação</label><input id="iObs" class="campo" maxlength="80" placeholder="Ex.: Camil ou Namorado" value="${esc(obs)}" autocomplete="off">
      <span class="rot">Onde comprar (sugestão)</span>
      <div class="chips quebra"><button type="button" class="chip" data-a="sug" data-v="" aria-pressed="${!sugestao}">Qualquer lugar</button>${lugares.map(m => `<button type="button" class="chip" data-a="sug" data-v="${esc(m)}" aria-pressed="${sugestao === m}">${esc(m)}</button>`).join('')}</div>
      ${hist.length ? `<div class="hist"><div style="border:0;padding-top:0"><b>Últimos preços pagos</b></div>${hist.map(x => `<div><span>${fmtData(x.data)}${x.mercado ? ' em ' + esc(x.mercado) : ''}</span><b>${fmt(x.preco)}</b></div>`).join('')}</div>` : ''}
      <div class="sheet-acoes">
        ${at.comprado ? `<button class="btn pri" data-a="comprado">Atualizar no carrinho</button><button class="btn sec" data-a="desmarcar">Tirar do carrinho</button>` : `<button class="btn pri" data-a="comprado">Colocar no carrinho</button><button class="btn sec" data-a="salvar">Salvar sem marcar</button>`}
      </div>
      <div class="sheet-acoes duas"><button class="btn texto" data-a="editar">Editar produto</button><button class="btn texto perigo-txt" data-a="remover">Remover da lista</button></div>`;
    },
    montar(el){
      const iq = el.querySelector('#iQtd'), ip = el.querySelector('#iPreco'), io = el.querySelector('#iObs');
      const at = () => { qtd = parseNum(iq.value); precoTxt = ip.value; el.querySelector('#iResumo').innerHTML = resumo(); };
      iq.addEventListener('input', at); ip.addEventListener('input', at); io.addEventListener('input', () => { obs = io.value; });
      ip.addEventListener('keydown', e => { if (e.key === 'Enter') s.acoes.comprado(); });
      if (focarPreco) { focarPreco = false; setTimeout(() => { const alvo = qtd > 0 ? ip : iq; alvo.focus(); alvo.select(); }, 80); }
    },
    acoes: {
      mais(b){ const iq = b.closest('.sheet').querySelector('#iQtd'); const v = parseNum(iq.value); qtd = r3((Number.isFinite(v) ? v : 0) + passo); iq.value = String(qtd).replace('.', ','); iq.dispatchEvent(new Event('input')); },
      menos(b){ const iq = b.closest('.sheet').querySelector('#iQtd'); const v = parseNum(iq.value); qtd = r3(Math.max(passo, (Number.isFinite(v) ? v : passo) - passo)); iq.value = String(qtd).replace('.', ','); iq.dispatchEvent(new Event('input')); },
      sug(b){ sugestao = b.dataset.v; mostrarSheet(); },
      comparar(){ gravarItem(false, true); abrirComparador(pid); },
      comprado(){ gravarItem(true); },
      salvar(){ gravarItem(false); },
      desmarcar(){ const c = editarCompraAberta(); const it = c.itens.find(i => i.pid === pid); if (it) { it.comprado = false; delete it.compradoEm; delete it.local; Dados.salvarCompra(c); } fecharSheet(); },
      remover(){
        const c = editarCompraAberta(); const ant = clone(c); c.itens = c.itens.filter(i => i.pid !== pid); Dados.salvarCompra(c); fecharSheet();
        toast(nome + ' removido da lista', {rotulo:'Desfazer', fn: () => Dados.salvarCompra(ant)});
      },
      editar(){ abrirProduto(pid); },
    },
  };
  /** Grava quantidade, preço, observação e sugestão; marca como comprado quando pedido. */
  function gravarItem(marcar, manterAberta){
    const pr = parseNum(precoTxt);
    if (marcar && !(qtd > 0)) return toast('Informe a quantidade.');
    if (marcar && !(pr > 0)) return toast('Informe o preço para colocar no carrinho.');
    const aplicar = () => {
      const c = editarCompraAberta(); const it = c.itens.find(i => i.pid === pid); if (!it) return fecharSheet();
      it.qtd = qtd > 0 ? r3(qtd) : null; it.preco = pr > 0 ? r2(pr) : null; it.obs = obs.trim().slice(0, 80) || null; it.sugestao = sugestao || null;
      if (marcar) { it.comprado = true; it.compradoEm = it.compradoEm || Date.now(); it.local = c.mercado; }
      Dados.salvarCompra(c);
      if (!manterAberta) fecharSheet();
      if (marcar) toast(nome + ' no carrinho');
    };
    if (marcar) exigirLugar(aplicar); else aplicar();
  }
  abrirSheet(s);
}

/* =========================================================
   FOLHA: ADICIONAR À LISTA (busca no catálogo, código, novo)

function abrirAdicionar(){
  let q = '';
  const res = () => {
    const ab = compraAberta(); const naLista = new Map(((ab && ab.itens) || []).map(i => [i.pid, i]));

      <button class="btn pri bloco" style="margin-top:10px" data-a="nota">${ICONES.arquivo}Ler nota fiscal</button>

    montar(el){ const i = el.querySelector('#buscaAdd'); i.addEventListener('input', () => { q = i.value; el.querySelector('#addRes').innerHTML = res(); }); },
    acoes: {
      add(b){ const p = Dados.produtos.get(b.dataset.pid); if (addNaLista(b.dataset.pid)) toast((p ? p.nome : 'Produto') + ' adicionado. Ajuste a quantidade no − +'); const r = b.closest('.sheet').querySelector('#addRes'); setTimeout(() => { r.innerHTML = res(); }, 0); },
      'qtd-mais'(b){ ajustarQtdLista(b.dataset.pid, 1); const r = b.closest('.sheet').querySelector('#addRes'); setTimeout(() => { r.innerHTML = res(); }, 0); },
      'qtd-menos'(b){ ajustarQtdLista(b.dataset.pid, -1); const r = b.closest('.sheet').querySelector('#addRes'); setTimeout(() => { r.innerHTML = res(); }, 0); },
      novo(){ abrirProduto(null, {nome: q.trim(), adicionarNaLista: true}); },
      nota(){ abrirLerNota(); },
      colar(){ abrirColar(); },
      async scan(){ const cod = await lerCodigoAoVivo(); if (cod) tratarCodigoLido(cod, true); },
      async digitar(){ const cod = await digitarCodigo(); if (cod) tratarCodigoLido(cod, true); },
    },
    aoFechar(){},
  });
}
/** Após ler um código: abre o produto existente ou inicia o cadastro. */
function tratarCodigoLido(cod, paraLista){
  const p = [...Dados.produtos.values()].find(x => x.codigo === cod);
  if (p) {
    if (!paraLista) return abrirProduto(p.id);
    const ab = compraAberta();
    if (ab && ab.itens.some(i => i.pid === p.id)) { fecharTodasSheets(); return abrirItem(p.id, true); }
    addNaLista(p.id); toast(p.nome + ' adicionado à lista');
    const s = topoSheet(); if (s) mostrarSheet();
    return;
  }
  abrirProduto(null, {codigo: cod, adicionarNaLista: paraLista});
}
function fecharTodasSheets(){ while (pilha.length) fecharSheet(); }

/* =========================================================
   FOLHA: CADASTRO DE PRODUTO (foto, IA, código, categoria)
   ========================================================= */
function abrirProduto(pid, opts = {}){
  const orig = pid ? Dados.produtos.get(pid) : null;
  const f = orig ? clone(orig) : {id: novoId(), nome: opts.nome || '', marca: '', tamanho: '', unidade: 'un', categoriaId: (UI.tab === 'produtos' ? UI.catProdutos : UI.filtroCat) || null, codigo: opts.codigo || '', fotoId: null, fotoData: null, criadoEm: Date.now()};
  if (f.categoriaId === '_sem') f.categoriaId = null;
  const st = {arquivo: null, previa: null, removerFoto: false, salvando: false, leitura: null, seq: 0};
  const fotoAtual = () => st.previa || (st.removerFoto ? null : fotoUrl(f));
  const s = {
    titulo: orig ? 'Editar produto' : 'Novo produto',
    html(){
      const u = fotoAtual();
      return `<div class="foto-area">
          ${u ? `<img class="foto-prev" src="${esc(u)}" alt="Foto do produto">` : `<div class="foto-prev">Sem foto (opcional)</div>`}
          <div class="foto-btns">
            ${botaoArquivo('foto-camera', 'Tirar foto', {camera: true, icone: 'camera'})}
            ${botaoArquivo('foto-galeria', 'Escolher da galeria', {icone: 'galeria'})}
            ${u ? `<button class="btn texto perigo-txt" data-a="foto-remover">Remover foto</button>` : ''}
          </div>
        </div>
        ${leituraHTML()}
        <label class="rot" for="pNome">Nome</label><input id="pNome" class="campo" data-f="nome" value="${esc(f.nome)}" maxlength="60" placeholder="Ex.: Papel higiênico folha dupla" autocomplete="off">
        <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:10px">
          <div><label class="rot" for="pMarca">Marca</label><input id="pMarca" class="campo" data-f="marca" value="${esc(f.marca)}" maxlength="40" autocomplete="off"></div>
          <div><label class="rot" for="pTam">Tamanho</label><input id="pTam" class="campo" data-f="tamanho" value="${esc(f.tamanho)}" maxlength="20" placeholder="1 L, 500 g" autocomplete="off"></div>
        </div>
        <span class="rot">Vendido por</span>
        <div class="seg" role="group"><button type="button" data-a="un" data-v="un" aria-pressed="${f.unidade !== 'kg'}">Unidade</button><button type="button" data-a="un" data-v="kg" aria-pressed="${f.unidade === 'kg'}">Peso (kg)</button></div>
        <span class="rot">Comparar preço por</span>
        <div class="chips quebra">${Object.entries(MEDIDAS).map(([k, m]) => `<button type="button" class="chip" data-a="medida" data-v="${k}" aria-pressed="${medidaPadrao(f) === k}">${esc(m.rotulo)}</button>`).join('')}</div>
        <span class="rot">Categoria</span>
        <div class="chips quebra">${Dados.cfg.categorias.map(c => `<button type="button" class="chip" data-a="cat" data-v="${esc(c.id)}" aria-pressed="${f.categoriaId === c.id}"><i class="dot" style="background:${esc(c.cor)}"></i>${esc(c.nome)}</button>`).join('')}</div>
        <label class="rot" for="pCod">Código de barras</label>
        <div class="campo-linha"><input id="pCod" class="campo" data-f="codigo" value="${esc(f.codigo)}" inputmode="numeric" maxlength="14" placeholder="Opcional" autocomplete="off"><button class="btn sec" data-a="cod-ler">${ICONES.codigo}Ler</button></div>
        <div class="sheet-acoes"><button class="btn pri" data-a="salvar" ${st.salvando ? 'disabled' : ''}>${st.salvando ? 'Salvando…' : (opts.adicionarNaLista && !orig ? 'Salvar e adicionar à lista' : 'Salvar produto')}</button></div>
        ${orig ? `<div class="sheet-acoes"><button class="btn texto perigo-txt" data-a="excluir">Excluir produto</button></div>` : ''}`;
    },
    montar(el){ el.querySelectorAll('[data-f]').forEach(i => i.addEventListener('input', () => { f[i.dataset.f] = i.value; })); },
    acoes: {
      'foto-camera'(el, a){ if (a) definirFoto(a); },
      'foto-galeria'(el, a){ if (a) definirFoto(a); },
      'foto-remover'(){ if (st.previa) URL.revokeObjectURL(st.previa); st.previa = null; st.arquivo = null; st.removerFoto = true; mostrarSheet(); },
      un(b){ f.unidade = b.dataset.v === 'kg' ? 'kg' : 'un'; mostrarSheet(); },
      medida(b){ if (MEDIDAS[b.dataset.v]) f.medida = b.dataset.v; mostrarSheet(); },
      cat(b){ f.categoriaId = f.categoriaId === b.dataset.v ? null : b.dataset.v; mostrarSheet(); },
      async 'cod-ler'(){ const c = await lerCodigoAoVivo(); if (c) { f.codigo = c; mostrarSheet(); if (faltaPreencher()) preencherPeloCodigo(c); } },
      'ia-repetir'(){ if (st.leitura && st.leitura.repetir && st.arquivo) preencherPelaFoto(st.arquivo, st.leitura.repetir); else if (f.codigo) preencherPeloCodigo(f.codigo); },
      'ia-outro'(){ if (st.leitura && st.leitura.outro && st.arquivo) preencherPelaFoto(st.arquivo, st.leitura.outro); },
      async salvar(){
        if (st.salvando) return;
        f.nome = (f.nome || '').trim(); f.marca = (f.marca || '').trim(); f.tamanho = (f.tamanho || '').trim();
        if (!f.nome) return toast('Informe o nome do produto.');
        f.codigo = (f.codigo || '').replace(/\D/g, '');
        if (f.codigo && !/^\d{8,14}$/.test(f.codigo)) return toast('O código de barras deve ter de 8 a 14 dígitos.');
        const dupCod = f.codigo && [...Dados.produtos.values()].find(x => x.id !== f.id && x.codigo === f.codigo);
        if (dupCod) return toast('Este código já está no produto ' + dupCod.nome + '.');
        const dupNome = [...Dados.produtos.values()].find(x => x.id !== f.id && norm(x.nome) === norm(f.nome) && norm(x.marca) === norm(f.marca));
        if (dupNome && !(await confirmar(`Já existe "${dupNome.nome}"${dupNome.marca ? ' da marca ' + dupNome.marca : ''}. Salvar outro mesmo assim?`, 'Salvar'))) return;
