        try {
          const antigo = orig && orig.fotoId;
          if (st.arquivo) { const r = await salvarFoto(st.arquivo); f.fotoId = r.fotoId; f.fotoData = r.fotoData; }
          else if (st.removerFoto) { f.fotoId = null; f.fotoData = null; }
          Dados.salvarProduto(f);
          if (opts.adicionarNaLista && !orig) addNaLista(f.id);
          st.salvando = false; fecharSheet();
          toast(orig ? 'Produto atualizado' : (opts.adicionarNaLista ? f.nome + ' cadastrado e adicionado à lista' : 'Produto cadastrado'));
        } catch { st.salvando = false; mostrarSheet(); toast('Não foi possível salvar a foto. Tente de novo.'); }
      },
      async excluir(){
        if (!(await confirmar(`Excluir "${f.nome}" do catálogo? O histórico de compras continua guardado.`, 'Excluir', true))) return;
        const ab = compraAberta();
        if (ab && ab.itens.some(i => i.pid === f.id)) { const c = clone(ab); c.itens = c.itens.filter(i => i.pid !== f.id); Dados.salvarCompra(c); }
        Dados.excluirProduto(f.id); fecharTodasSheets(); toast('Produto excluído');
      },
    },
    aoFechar(){ if (st.previa) URL.revokeObjectURL(st.previa); },
  };
  /** Guarda a foto escolhida para pré-visualização, IA e gravação. */
  function definirFoto(a){
    if (!/^image\//.test(a.type || '')) return toast('Escolha um arquivo de imagem.');
    if (st.previa) URL.revokeObjectURL(st.previa);
    st.arquivo = a; st.previa = URL.createObjectURL(a); st.removerFoto = false;
    mostrarSheet();
    if (faltaPreencher()) preencherPelaFoto(a);
  }
  /** Linha de status da leitura automática (base aberta ou IA). */
  function leituraHTML(){
    const l = st.leitura; if (!l) return '';
    if (l.fase === 'lendo') return `<div class="ia-status" role="status"><div class="spin"></div><span>${esc(l.texto)}</span></div>`;
    const botoes = (l.repetir ? '<button class="btn texto" data-a="ia-repetir">Tentar de novo</button>' : '') + (l.outro ? `<button class="btn texto" data-a="ia-outro">Tentar com o ${esc(NOME_IA[l.outro])}</button>` : '');
    return `<div class="ia-status${l.fase === 'erro' ? ' perigo-txt' : ''}" role="status" style="flex-wrap:wrap"><span style="flex:1 1 100%">${esc(l.texto)}</span>${botoes}</div>`;
  }
  const vazio = c => !String(f[c] || '').trim();
  const faltaPreencher = () => vazio('nome') || vazio('marca') || vazio('tamanho');
  /** Atualiza a folha só se ela ainda estiver aberta no topo. */
  const redesenhar = () => { if (topoSheet() === s) mostrarSheet(); };
  /** Preenche apenas os campos vazios; devolve os nomes dos campos preenchidos. */
  function aplicarLeitura(d){
    const feitos = [];
    for (const [campo, rotulo] of [['nome', 'nome'], ['marca', 'marca'], ['tamanho', 'tamanho']]) if (d[campo] && vazio(campo)) { f[campo] = d[campo]; feitos.push(rotulo); }
    if (d.medida && !MEDIDAS[f.medida] && MEDIDAS[d.medida]) f.medida = d.medida;
    if (d.categoriaId && !f.categoriaId) { f.categoriaId = d.categoriaId; feitos.push('categoria'); }
    return feitos;
  }
  async function preencherPeloCodigo(cod){
    const n = ++st.seq;
    st.leitura = {fase: 'lendo', texto: 'Procurando o código na base aberta…'}; redesenhar();
    const d = await buscarNaBaseAberta(cod);
    if (n !== st.seq) return;
    if (!d) {
      const p = IA.atual();
      st.leitura = {fase: 'info', texto: p ? `Código não encontrado na base aberta. Tire uma foto da frente para o ${NOME_IA[p]} preencher.` : 'Código não encontrado na base aberta. Preencha à mão ou configure uma IA em Ajustes para preencher pela foto.'};
      return redesenhar();
    }
    const feitos = aplicarLeitura(d);
    st.leitura = {fase: 'ok', texto: feitos.length ? `Preenchido pela base aberta: ${feitos.join(', ')}. Confira antes de salvar.` : 'Os campos já estavam preenchidos.'};
    redesenhar();
  }
  async function preencherPelaFoto(arq, provedor = IA.atual()){
    const n = ++st.seq;
    st.leitura = {fase: 'lendo', texto: provedor ? `Lendo a foto com o ${NOME_IA[provedor]}…` : 'Lendo a foto…'}; redesenhar();
    try {
      const d = await lerFotoComIA(arq, provedor);
      if (n !== st.seq) return;
      const feitos = aplicarLeitura(d);
      st.leitura = {fase: 'ok', texto: feitos.length ? `Preenchido pelo ${d.fonte}: ${feitos.join(', ')}. Confira antes de salvar.` : 'Os campos já estavam preenchidos.'};
    } catch (e) {
      if (n !== st.seq) return;
      const repetir = e && ['rede', 'limite', 'formato'].includes(e.codigo) ? e.provedor : null;
      const outro = e && e.provedor ? IA.outro(e.provedor) : null;
      st.leitura = {fase: e && e.codigo === 'sem-chave' ? 'info' : 'erro', texto: (e && e.message) || 'Não foi possível ler a foto.', repetir, outro};
    }
    redesenhar();
  }
  abrirSheet(s);
  if (!orig && f.codigo) preencherPeloCodigo(f.codigo);
}

async function definirOrcamento(){
  const c0 = compraAberta();
  const t = await perguntar('Orçamento desta compra', c0 && c0.orcamento ? fmtNum2(c0.orcamento) : '', {placeholder: 'Deixe vazio para remover', modo: 'decimal'});
  if (t === null) return;
  const v = parseNum(t);
  const c = editarCompraAberta(); c.orcamento = v > 0 ? r2(v) : null; Dados.salvarCompra(c);

/** Finaliza a compra separando por lugar real; itens não comprados seguem para a próxima lista. */
async function finalizarCompra(){
  const c = compraAberta(); if (!c || !c.itens.length) return toast('A lista está vazia.');
  const comprados = c.itens.filter(i => i.comprado), pend = c.itens.filter(i => !i.comprado);
  if (!comprados.length) return toast('Coloque ao menos um item no carrinho.');
  if (comprados.some(i => !i.local) && !c.mercado) return abrirMercado(finalizarCompra);
  const porLugar = new Map();
  for (const it of comprados) { const k = it.local || c.mercado; if (!porLugar.has(k)) porLugar.set(k, []); porLugar.get(k).push(it); }
  const resumo = [...porLugar].map(([k, l]) => `${k} ${fmt(r2(l.reduce((s, i) => s + i.qtd * i.preco, 0)))}`).join('; ');
  const ok = await confirmar(`Finalizar a compra? ${resumo}.` + (porLugar.size > 1 ? ' Fica registrada uma compra por lugar.' : '') + (pend.length ? ` ${pend.length} ${pend.length === 1 ? 'item não comprado vai' : 'itens não comprados vão'} para a próxima lista.` : ''), 'Finalizar');
  if (!ok) return;
  const agora = Date.now(); let primeira = true;
  for (const [lugar, lst] of porLugar) {
    const itens = lst.map(i => Object.assign(clone(i), {local: lugar}));
    Dados.salvarCompra({id: primeira ? c.id : novoId(), status: 'finalizada', mercado: lugar, orcamento: porLugar.size === 1 ? (c.orcamento || null) : null, criadaEm: c.criadaEm, finalizadaEm: agora, total: r2(itens.reduce((s, i) => s + i.qtd * i.preco, 0)), itens});
    primeira = false;
  }
  if (pend.length) Dados.salvarCompra({id: novoId(), status: 'aberta', mercado: '', orcamento: c.orcamento || null, criadaEm: agora, itens: pend.map(i => Object.assign(clone(i), {preco: null}))});
  buscaLista = ''; UI.filtroCat = ''; salvarUI();
  toast(porLugar.size > 1 ? `${porLugar.size} compras guardadas no histórico` : 'Compra finalizada e guardada no histórico');
}
/** Copia os itens de uma compra anterior para a lista atual. */
function repetirCompra(id){
  const ant = Dados.compras.get(id); if (!ant) return;
  const c = editarCompraAberta(); const ja = new Set(c.itens.map(i => i.pid)); let n = 0;
  for (const it of ant.itens) {
    const p = Dados.produtos.get(it.pid); if (!p || ja.has(it.pid)) continue;
    c.itens.push({pid: p.id, nome: p.nome, marca: p.marca || '', categoriaId: catDoProduto(p), unidade: p.unidade || 'un', qtd: it.qtd || 1, preco: null, comprado: false, obs: it.obs || null, sugestao: it.sugestao || null}); n++;
  }
  if (!n) return toast('Esses itens já estão na lista.');
  Dados.salvarCompra(c); toast(n + (n === 1 ? ' item adicionado' : ' itens adicionados'));
}

/* =========================================================
   FOLHA: COMPARADOR DE EMBALAGENS
   ========================================================= */
function abrirComparador(pid){
  const p0 = Dados.produtos.get(pid); if (!p0) return;
  const it0 = compraAberta()?.itens.find(i => i.pid === pid);
  let medida = medidaPadrao(p0);
  const nova = () => ({marca: '', preco: '', qtdEmb: '1', tam: '', sub: MEDIDAS[medida].padrao, promo: 'nenhuma', leveL: '3', leveP: '2', segPct: '50'});
  // pré-preenche com as marcas e tamanhos das últimas comparações (preço em branco)
  const anteriores = []; const vistos = new Set();
  for (const r of [...(p0.comparacoes || [])].reverse()) { const k = norm(r.marca) + '|' + r.tam + r.sub; if (r.medida === medida && r.marca && !vistos.has(k)) { vistos.add(k); anteriores.push({...nova(), marca: r.marca, qtdEmb: String(r.qtdEmb || 1), tam: String(r.tam || '').replace('.', ','), sub: r.sub}); } if (anteriores.length >= 3) break; }
  let opcoes = anteriores.length >= 2 ? anteriores : [...anteriores, nova(), nova()].slice(0, 2);
  let qtdLevar = it0 && it0.qtd > 0 ? String(it0.qtd).replace('.', ',') : '';
  /** Melhores marcas do histórico (menor preço por unidade). */
  const historico = () => {
    const regs = (Dados.produtos.get(pid)?.comparacoes || []).filter(r => r.medida === medida && r.unit > 0);
    if (!regs.length) return '';
    const melhor = new Map(); for (const r of regs) { const k = norm(r.marca) || '-'; if (!melhor.has(k) || r.unit < melhor.get(k).unit) melhor.set(k, r); }
    const top = [...melhor.values()].sort((a, b) => a.unit - b.unit).slice(0, 3);
    return `<div class="hist"><div style="border:0;padding-top:0"><b>Melhores preços já comparados</b></div>${top.map(r => `<div><span>${esc(r.marca || 'Sem marca')}${r.lugar ? ' em ' + esc(r.lugar) : ''} (${fmtDataCurta(r.em)})</span><b>${fmtUnit(r.unit)}/${MEDIDAS[medida].base}</b></div>`).join('')}</div>`;
  };
  /** Ranking das opções preenchidas. */
  const ranking = () => {
    const calc = opcoes.map((o, i) => ({i, o, r: calcularOpcao(o, medida)})).filter(x => x.r).sort((a, b) => a.r.unit - b.r.unit);
    if (!calc.length) return `<div class="contagem">Preencha preço e tamanho de pelo menos uma opção.</div>`;
    const base = MEDIDAS[medida].base; const v = calc[0];
    let h = `<div class="resumo-item" style="grid-template-columns:auto 1fr auto">${calc.map((x, k) => `<span>${k + 1}º</span><span class="${k === 0 ? 'melhor' : ''}">${esc(x.o.marca || 'Opção ' + (x.i + 1))}${x.r.levar > 1 ? ` <small>(levando ${x.r.levar})</small>` : ''}</span><strong class="${k === 0 ? 'melhor' : ''}">${fmtUnit(x.r.unit)}/${base}${k > 0 ? ` <small style="font-weight:500">+${Math.round((x.r.unit / v.r.unit - 1) * 100)}%</small>` : ''}</strong>`).join('')}</div>`;
    if (calc.length > 1) h += `<div class="aviso bom">${esc(v.o.marca || 'Opção ' + (v.i + 1))} é a mais vantajosa: ${Math.round((1 - v.r.unit / calc[1].r.unit) * 100)}% mais barata que a segunda.</div>`;
    return h;
  };
  /** Bloco de entrada de uma opção. */
  const opcaoHTML = (o, i) => {
    const M = MEDIDAS[medida];
    const tamanho = medida === 'un' ? `<label class="rot">Unidades na embalagem</label><input class="campo" data-o="${i}" data-k="qtdEmb" inputmode="decimal" value="${esc(o.qtdEmb)}">`
      : medida === 'lav' ? `<label class="rot">Rende quantas lavagens/doses</label><input class="campo" data-o="${i}" data-k="tam" inputmode="decimal" value="${esc(o.tam)}">`
      : `<div style="display:grid;grid-template-columns:1fr 1.3fr;gap:8px"><div><label class="rot">Itens na embalagem</label><input class="campo" data-o="${i}" data-k="qtdEmb" inputmode="decimal" value="${esc(o.qtdEmb)}"></div><div><label class="rot">Tamanho de cada</label><div class="campo-linha"><input class="campo" data-o="${i}" data-k="tam" inputmode="decimal" placeholder="0" value="${esc(o.tam)}">${M.subs.length > 1 ? `<select class="campo" style="width:auto" data-o="${i}" data-k="sub">${M.subs.map(s => `<option value="${s[0]}" ${o.sub === s[0] ? 'selected' : ''}>${s[0]}</option>`).join('')}</select>` : `<span style="align-self:center">${M.subs[0][0]}</span>`}</div></div></div>`;
    const promo = `<label class="rot">Promoção</label><select class="campo" data-o="${i}" data-k="promo" data-re="1"><option value="nenhuma" ${o.promo === 'nenhuma' ? 'selected' : ''}>Nenhuma</option><option value="leve" ${o.promo === 'leve' ? 'selected' : ''}>Leve X, pague Y</option><option value="segunda" ${o.promo === 'segunda' ? 'selected' : ''}>Desconto na 2ª unidade</option></select>`
      + (o.promo === 'leve' ? `<div class="campo-linha" style="margin-top:8px;align-items:center"><span>Leve</span><input class="campo" data-o="${i}" data-k="leveL" inputmode="numeric" value="${esc(o.leveL)}"><span>pague</span><input class="campo" data-o="${i}" data-k="leveP" inputmode="numeric" value="${esc(o.leveP)}"></div>` : '')
      + (o.promo === 'segunda' ? `<div class="campo-linha" style="margin-top:8px;align-items:center"><span>2ª unidade com</span><input class="campo" data-o="${i}" data-k="segPct" inputmode="numeric" value="${esc(o.segPct)}"><span>% off</span></div>` : '');
    return `<section class="cartao" style="margin:10px 0"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Opção ${i + 1}</h2>${opcoes.length > 2 ? `<button class="btn texto perigo-txt" data-a="rem-op" data-i="${i}">Remover</button>` : ''}</div>
      <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:8px"><div><label class="rot">Marca</label><input class="campo" data-o="${i}" data-k="marca" maxlength="40" value="${esc(o.marca)}" autocomplete="off"></div><div><label class="rot">Preço</label><div class="preco-campo"><span>R$</span><input class="campo" style="font-size:16px" data-o="${i}" data-k="preco" inputmode="decimal" placeholder="0,00" value="${esc(o.preco)}"></div></div></div>
      ${tamanho}${promo}</section>`;
  };
  const s = {
    titulo: 'Comparar: ' + p0.nome,
    html(){
      const un = p0.unidade === 'kg';
      return `<span class="rot">Comparar preço por</span><div class="chips quebra">${Object.entries(MEDIDAS).map(([k, m]) => `<button class="chip" data-a="medida" data-v="${k}" aria-pressed="${medida === k}">${esc(m.rotulo)}</button>`).join('')}</div>
        ${historico()}
        ${opcoes.map(opcaoHTML).join('')}
        ${opcoes.length < 6 ? `<button class="btn sec bloco" data-a="add-op">Adicionar opção</button>` : ''}
        <h2 class="secao-titulo">Resultado</h2><div id="cmpRes">${ranking()}</div>
        <label class="rot" for="cmpQtd">${un ? 'Quantos kg vai levar' : 'Quantas embalagens vai levar'}</label><input id="cmpQtd" class="campo" inputmode="decimal" placeholder="${un ? 'kg' : 'embalagens'}" value="${esc(qtdLevar)}">
        <div class="sheet-acoes"><button class="btn pri" data-a="levar">Colocar a mais vantajosa no carrinho</button><button class="btn sec" data-a="so-salvar">Salvar comparação sem comprar</button></div>`;
    },
    montar(el){
      el.querySelectorAll('[data-o]').forEach(inp => {
        const ev = inp.tagName === 'SELECT' ? 'change' : 'input';
        inp.addEventListener(ev, () => { opcoes[Number(inp.dataset.o)][inp.dataset.k] = inp.value; if (inp.dataset.re) mostrarSheet(); else el.querySelector('#cmpRes').innerHTML = ranking(); });
      });
      el.querySelector('#cmpQtd').addEventListener('input', e => { qtdLevar = e.target.value; });
    },
    acoes: {
      medida(b){ if (!MEDIDAS[b.dataset.v]) return; medida = b.dataset.v; opcoes.forEach(o => { o.sub = MEDIDAS[medida].padrao; }); mostrarSheet(); },
      'add-op'(){ opcoes.push(nova()); mostrarSheet(); },
      'rem-op'(b){ opcoes.splice(Number(b.dataset.i), 1); mostrarSheet(); },
      'so-salvar'(){ if (salvarHistorico()) { fecharSheet(); toast('Comparação salva'); } },
      levar(){
        const calc = opcoes.map(o => ({o, r: calcularOpcao(o, medida)})).filter(x => x.r).sort((a, b) => a.r.unit - b.r.unit);
        if (!calc.length) return toast('Preencha preço e tamanho de pelo menos uma opção.');
        const v = calc[0]; const kg = p0.unidade === 'kg';
        let q = parseNum(qtdLevar); if (!(q > 0)) q = kg ? NaN : v.r.levar;
        if (!(q > 0)) return toast('Informe quantos kg vai levar.');
        const preco = kg && medida === 'kg' ? r2(v.r.unit) : r2(v.r.precoEf);
        exigirLugar(() => {
          salvarHistorico();
          const c = editarCompraAberta(); const it = c.itens.find(i => i.pid === pid); if (!it) return;
          Object.assign(it, {qtd: r3(q), preco, comprado: true, compradoEm: Date.now(), local: c.mercado, marcaCompra: (v.o.marca || '').trim().slice(0, 40) || null});
          Dados.salvarCompra(c);
          while (pilha.length) fecharSheet();
          toast(`${p0.nome}${v.o.marca ? ' ' + v.o.marca : ''} no carrinho`);
        });
      },
    },
  };
  /** Guarda as opções válidas no histórico do produto e a medida escolhida. */
  function salvarHistorico(){
    const validas = opcoes.map(o => ({o, r: calcularOpcao(o, medida)})).filter(x => x.r);
    if (!validas.length) { toast('Preencha preço e tamanho de pelo menos uma opção.'); return false; }
    const p = clone(Dados.produtos.get(pid)); const lugar = compraAberta()?.mercado || '';
    const regs = validas.map(({o, r}) => ({em: Date.now(), lugar, medida, marca: (o.marca || '').trim().slice(0, 40), preco: r2(parseNum(o.preco)), qtdEmb: medida === 'lav' ? 1 : (parseNum(o.qtdEmb) || 1), tam: medida === 'un' ? 1 : parseNum(o.tam), sub: o.sub, promo: o.promo, unit: r.unit}));
    p.comparacoes = [...(p.comparacoes || []), ...regs].slice(-40); p.medida = medida;
    Dados.salvarProduto(p); return true;
  }
  abrirSheet(s);
}

      return `<div class="contagem" style="margin-top:0">Cole a lista recebida por mensagem. Títulos como *Quitanda do Centro* viram sugestão de lugar para os itens abaixo deles.</div>
        <textarea id="txtLista" class="campo" rows="12" maxlength="${LIMITE_LISTA}" placeholder="4 pct Feijão&#10;Leite&#10;*Quitanda do Centro*&#10;Batata" style="resize:vertical">${esc(texto)}</textarea>

        const ev = inp.type === 'checkbox' || inp.tagName === 'SELECT' ? 'change' : 'input';
        inp.addEventListener(ev, () => {
          const it = itens[Number(inp.dataset.i)]; const k = inp.dataset.k;
          if (k === 'incluir') { it.incluir = inp.checked; mostrarSheet(); }
          else if (k === 'qtd') it.qtd = parseNum(inp.value) > 0 ? parseNum(inp.value) : null;

          const c = editarCompraAberta(); const naLista = new Set(c.itens.map(i => i.pid));
          for (const x of sel) {

              await Dados.gravarProduto(p);
              novos++;
            }
            if (naLista.has(p.id)) { ja++; continue; }
            naLista.add(p.id);
            c.itens.push({pid: p.id, nome: p.nome, marca: p.marca || '', categoriaId: catDoProduto(p), unidade: p.unidade || 'un', qtd: x.qtd > 0 ? r3(x.qtd) : null, preco: null, comprado: false, obs: (x.obs || '').trim().slice(0, 80) || null, sugestao: x.lugar || null});
          }
          Dados.salvarCompra(c);
          while (pilha.length) fecharSheet();
          toast(`${sel.length - ja} itens na lista` + (novos ? `, ${novos} produtos novos cadastrados` : '') + (ja ? `, ${ja} já estavam na lista` : ''), null, 4500);

}

<script>
'use strict';
/* =========================================================
   RELATÓRIOS: período e agregações
   ========================================================= */
const PERIODOS = [['mes','Este mês'],['3m','3 meses'],['12m','12 meses'],['tudo','Tudo']];
function inicioPeriodo(){
  const d = new Date();
  if (UI.periodo === 'mes') return new Date(d.getFullYear(), d.getMonth(), 1).getTime();
  if (UI.periodo === '3m') return new Date(d.getFullYear(), d.getMonth() - 2, 1).getTime();
  if (UI.periodo === '12m') return new Date(d.getFullYear(), d.getMonth() - 11, 1).getTime();
  return 0;
}
const rotuloPeriodo = () => (PERIODOS.find(p => p[0] === UI.periodo) || PERIODOS[1])[1];
const comprasNoPeriodo = () => { const i = inicioPeriodo(); return comprasFeitas().filter(c => c.finalizadaEm >= i); };
/** Soma gastos por mês, categoria, produto e mercado. */
function agregados(compras){
  const porMes = new Map(), porCat = new Map(), porProd = new Map(), porMercado = new Map(), precosMercado = new Map();
  let total = 0, itens = 0;
  for (const c of compras) {
    let tc = 0; const mer = c.mercado || 'Sem mercado';
    for (const it of c.itens) {
      if (!it.comprado || !(it.preco > 0)) continue;
      const v = it.qtd * it.preco; tc += v; itens++;
      const cid = catIdItem(it) || ''; porCat.set(cid, (porCat.get(cid) || 0) + v);
      const pp = porProd.get(it.pid) || {pid: it.pid, nome: nomeItem(it), vezes: 0, gasto: 0, qtd: 0, un: unidadeItem(it)};
      pp.vezes++; pp.gasto += v; pp.qtd += it.qtd; porProd.set(it.pid, pp);
      const pm = precosMercado.get(it.pid) || new Map(); const l = pm.get(mer) || []; l.push(it.preco); pm.set(mer, l); precosMercado.set(it.pid, pm);
    }
    total += tc;
    const mk = mesChave(c.finalizadaEm); porMes.set(mk, (porMes.get(mk) || 0) + tc);
    const m = porMercado.get(mer) || {nome: mer, compras: 0, total: 0}; m.compras++; m.total += tc; porMercado.set(mer, m);
  }
  // mesmo produto em mercados diferentes
  const comparacao = [];
  for (const [pid, pm] of precosMercado) {
    if (pm.size < 2) continue;
    const medias = [...pm].map(([m, l]) => ({mercado: m, media: l.reduce((s, x) => s + x, 0) / l.length})).sort((a, b) => a.media - b.media);
    const dif = (medias[medias.length - 1].media - medias[0].media) / medias[0].media * 100;
    comparacao.push({pid, nome: nomeItem({pid, nome: porProd.get(pid).nome}), medias, dif});
  }
  comparacao.sort((a, b) => b.dif - a.dif);
  return {total: r2(total), itens, n: compras.length, porMes, porCat, porProd, porMercado, comparacao};
}
/** Meses do período, inclusive os sem compra. */
function mesesDoPeriodo(compras){
  const fim = new Date(); let ini = inicioPeriodo();
  if (!ini) ini = compras.length ? Math.min(...compras.map(c => c.finalizadaEm)) : Date.now();
  const d = new Date(ini); d.setDate(1); const out = [];
  while (d <= fim) { out.push(mesChave(d.getTime())); d.setMonth(d.getMonth() + 1); }
  return out.slice(-24);
}

/* =========================================================
   RELATÓRIOS: gráficos em SVG
   ========================================================= */
function svgBarras(dados){
  const W = 340, H = 160, pad = 6, base = H - 20, n = Math.max(dados.length, 1);
  const max = Math.max(...dados.map(d => d.valor), 1), bw = (W - pad * 2) / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto por mês">`;
  s += `<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  dados.forEach((d, i) => {
    const h = Math.round(d.valor / max * (base - 26)); const w = Math.min(bw * 0.68, 46); const x = pad + i * bw + (bw - w) / 2; const y = base - h;
    if (d.valor > 0) s += `<rect x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${Math.max(h, 2)}" rx="4" fill="var(--primary)"/>`;
    const mostraRot = n <= 12 || i % 2 === n % 2 - 1 || i === n - 1;
    if (mostraRot) s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle" class="ax">${esc(d.rotulo)}</text>`;
    if (d.valor > 0 && (n <= 6 || d.valor === max || i === n - 1)) s += `<text x="${(x + w / 2).toFixed(1)}" y="${y - 5}" text-anchor="middle" class="vl">${esc(curto(d.valor))}</text>`;
  });
  return s + '</svg>';
}
function svgLinha(pts){
  const W = 340, H = 170, pl = 14, pr = 14, top = 22, bot = 26;
  const ps = pts.map(p => p.preco); let min = Math.min(...ps), max = Math.max(...ps);
  if (min === max) { min = min * 0.9; max = max * 1.1 || 1; }
  const xs = i => pts.length === 1 ? W / 2 : pl + i * (W - pl - pr) / (pts.length - 1);
  const ys = v => top + (1 - (v - min) / (max - min)) * (H - top - bot);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do preço">`;
  s += `<line x1="0" x2="${W}" y1="${H - bot}" y2="${H - bot}" stroke="var(--line)"/>`;
  if (pts.length > 1) s += `<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p, i) => xs(i).toFixed(1) + ',' + ys(p.preco).toFixed(1)).join(' ')}"/>`;
  const iMin = ps.indexOf(Math.min(...ps)), iMax = ps.indexOf(Math.max(...ps));
  pts.forEach((p, i) => {
    s += `<circle cx="${xs(i).toFixed(1)}" cy="${ys(p.preco).toFixed(1)}" r="4" fill="var(--surface)" stroke="var(--primary)" stroke-width="2.5"/>`;
    if (i === 0 || i === pts.length - 1 || i === iMin || i === iMax) {
      const anc = i === 0 && pts.length > 1 ? 'start' : (i === pts.length - 1 && pts.length > 1 ? 'end' : 'middle');
      s += `<text x="${xs(i).toFixed(1)}" y="${(ys(p.preco) - 9).toFixed(1)}" text-anchor="${anc}" class="vl">${esc(fmt(p.preco))}</text>`;
    }
  });
  s += `<text x="${pl}" y="${H - 6}" class="ax">${esc(fmtData(pts[0].data))}</text>`;
  if (pts.length > 1) s += `<text x="${W - pr}" y="${H - 6}" text-anchor="end" class="ax">${esc(fmtData(pts[pts.length - 1].data))}</text>`;
  return s + '</svg>';
}

/* =========================================================
   TELA: RELATÓRIOS
   ========================================================= */
function telaRelatorios(){
  let h = `<div class="chips" role="group" aria-label="Período" style="margin-top:6px">${PERIODOS.map(([v, r]) => `<button class="chip" data-a="periodo" data-v="${v}" aria-pressed="${UI.periodo === v}">${r}</button>`).join('')}</div>`;
  const todas = comprasFeitas();
  if (!todas.length) return h + `<div class="vazio"><strong>Ainda não há compras finalizadas</strong>Os relatórios aparecem depois que você finalizar a primeira compra.</div>`;
  const compras = comprasNoPeriodo(); const a = agregados(compras);
  h += `<div class="stats"><div class="stat"><small>Total gasto</small><b>${fmt(a.total)}</b></div><div class="stat"><small>Compras</small><b>${a.n}</b></div><div class="stat"><small>Média por compra</small><b>${fmt(a.n ? a.total / a.n : 0)}</b></div><div class="stat"><small>Itens comprados</small><b>${a.itens}</b></div></div>`;
  if (Cap.downloads) h += `<div class="linha-topo"><button class="btn sec" data-a="exp-pdf">Baixar PDF</button><button class="btn sec" data-a="exp-xlsx">Baixar planilha</button></div>`;
  if (!compras.length) return h + `<div class="vazio"><strong>Nenhuma compra neste período</strong>Escolha um período maior.</div>` + historicoHTML(todas);
  // gasto por mês
  const meses = mesesDoPeriodo(compras);
  h += `<section class="cartao"><h2>Gasto por mês</h2><div class="grafico">${svgBarras(meses.map(k => ({rotulo: mesNome(k), valor: a.porMes.get(k) || 0})))}</div></section>`;
  // por categoria
  const cats = [...a.porCat].sort((x, y) => y[1] - x[1]); const maxCat = Math.max(...cats.map(c => c[1]), 1);
  h += `<section class="cartao"><h2>Por categoria</h2>${cats.map(([cid, v]) => { const c = cid ? categoria(cid) : SEM_CAT; return `<div class="barra-h"><span class="nm">${esc(c.nome)}</span><span class="trilho"><i style="width:${(v / maxCat * 100).toFixed(1)}%;background:${esc(c.cor)}"></i></span><span class="vl">${fmt(v)} <small style="color:var(--muted);font-weight:500">${Math.round(v / a.total * 100)}%</small></span></div>`; }).join('')}</section>`;
  // evolução de preço
  const hist = indice().hist; let pid = UI.produtoGrafico;
  if (!pid || !(hist.get(pid) || []).some(x => x.finalizada)) { const top = [...a.porProd.values()].sort((x, y) => y.vezes - x.vezes)[0]; pid = top ? top.pid : null; }
  if (pid) {
    const pts = (hist.get(pid) || []).filter(x => x.finalizada).slice(-24);
    const nome = Dados.produtos.get(pid)?.nome || a.porProd.get(pid)?.nome || 'Produto';
    const media = pts.reduce((s, x) => s + x.preco, 0) / pts.length;
    h += `<section class="cartao"><h2>Evolução do preço</h2><button class="chip" data-a="escolher-grafico" style="margin-bottom:10px">${esc(nome)} <small>trocar</small></button><div class="grafico">${svgLinha(pts)}</div><div class="contagem">${pts.length} ${pts.length === 1 ? 'registro' : 'registros'}, média ${fmt(media)}, menor ${fmt(Math.min(...pts.map(x => x.preco)))}</div></section>`;
  }
  // mercados
  const mers = [...a.porMercado.values()].sort((x, y) => y.total - x.total);
  h += `<section class="cartao"><h2>Mercados</h2><div class="tabela-wrap"><table class="tab"><thead><tr><th>Mercado</th><th class="num">Compras</th><th class="num">Total</th><th class="num">Média</th></tr></thead><tbody>${mers.map(m => `<tr><td>${esc(m.nome)}</td><td class="num">${m.compras}</td><td class="num">${fmt(m.total)}</td><td class="num">${fmt(m.total / m.compras)}</td></tr>`).join('')}</tbody></table></div>`;
  if (a.comparacao.length) h += `<h2 style="margin-top:16px">Mesmo produto, mercados diferentes</h2><div class="sub">Preço médio pago em cada mercado; o mais barato em destaque</div>${a.comparacao.slice(0, 10).map(c => `<div style="padding:8px 0;border-top:1px solid var(--line)"><div class="nome" style="white-space:normal">${esc(c.nome)} <span class="badge">${Math.round(c.dif)}% de diferença</span></div><div class="meta">${c.medias.map((m, i) => `<span class="${i === 0 ? 'melhor' : ''}">${esc(m.mercado)} ${fmt(m.media)}</span>`).join('')}</div></div>`).join('')}`;
  else h += `<div class="contagem" style="margin-top:10px">Compre o mesmo produto em mercados diferentes para ver a comparação de preços.</div>`;
  h += `</section>`;
  // ranking
  const rk = [...a.porProd.values()].sort((x, y) => y.vezes - x.vezes || y.gasto - x.gasto).slice(0, 10);
  h += `<section class="cartao"><h2>Mais comprados</h2><div class="tabela-wrap"><table class="tab"><thead><tr><th>Produto</th><th class="num">Vezes</th><th class="num">Gasto</th></tr></thead><tbody>${rk.map(p => `<tr><td>${esc(p.nome)}</td><td class="num">${p.vezes}</td><td class="num">${fmt(p.gasto)}</td></tr>`).join('')}</tbody></table></div></section>`;
  return h + historicoHTML(compras);
}
/** Lista de compras finalizadas. */
function historicoHTML(compras){
  return `<section class="cartao"><h2>Histórico de compras</h2>${compras.slice(0, 60).map(c => `<button class="compra-linha" data-a="ver-compra" data-id="${esc(c.id)}"><span><b>${fmtData(c.finalizadaEm)}</b><small>${esc(c.mercado || 'Sem mercado')}, ${c.itens.length} ${c.itens.length === 1 ? 'item' : 'itens'}</small></span><b>${fmt(c.total ?? totais(c).gasto)}</b></button>`).join('')}</section>`;

/** Detalhe de uma compra finalizada. */

/** Escolha do produto do gráfico de preço. */
function abrirEscolhaGrafico(){
  let q = '';
  const comHist = () => [...indice().hist.keys()].filter(pid => Dados.produtos.has(pid) && indice().hist.get(pid).some(x => x.finalizada)).map(pid => Dados.produtos.get(pid));
  const res = () => ordenarProdutos(comHist().filter(p => !q.trim() || casa(textoBusca(p), q))).slice(0, 80).map(p => `<button class="compra-linha" data-a="graf" data-pid="${esc(p.id)}"><span>${esc(p.nome)}<small>${esc([p.marca, p.tamanho].filter(Boolean).join(' '))}</small></span><span class="badge">${indice().hist.get(p.id).filter(x => x.finalizada).length}</span></button>`).join('') || '<div class="contagem">Nenhum produto encontrado.</div>';

/** Entrega um arquivo ao usuário pela capacidade de downloads. */
async function baixar(nome, blob){
  try { await Cap.downloads.save({filename: nome, data: blob}); }
  catch (e) {
    if (e && e.code === 'declined') return;
    if (e && e.code === 'rate_limited') return toast('Aguarde um instante e tente de novo.');
    toast('Não foi possível gerar o download.');
  }
}
const dataArquivo = () => new Date().toISOString().slice(0, 10);
/** Relatório em PDF com resumo, gráfico mensal e tabelas. */
async function exportarPDF(){

  const compras = comprasNoPeriodo(); const a = agregados(compras);
  const VERDE = [30, 107, 82], TINTA = [27, 37, 35], CINZA = [92, 106, 102];
  const fmtPdf = v => fmt(v).replace(/\u00a0/g, ' ');
  let y = 18;
  const novaPagina = alt => { if (y + alt > 282) { doc.addPage(); y = 18; } };
  const titulo = t => { novaPagina(16); doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...TINTA); doc.text(t, 14, y); y += 4; doc.setDrawColor(...VERDE); doc.setLineWidth(0.6); doc.line(14, y, 196, y); y += 5; };
  const tabela = (head, body, alinhaDir) => {
    doc.autoTable({startY: y, head: [head], body, theme: 'plain', margin: {left: 14, right: 14},
      styles: {font: 'helvetica', fontSize: 9, textColor: TINTA, cellPadding: 1.8},
      headStyles: {fillColor: VERDE, textColor: [255, 255, 255], fontStyle: 'bold'},
      alternateRowStyles: {fillColor: [244, 247, 245]},
      columnStyles: Object.fromEntries(alinhaDir.map(i => [i, {halign: 'right'}]))});
    y = doc.lastAutoTable.finalY + 8;
  };
  doc.setFont('helvetica', 'bold'); doc.setFontSize(19); doc.setTextColor(...TINTA); doc.text('Relatório de compras da casa', 14, y); y += 7;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...CINZA);
  doc.text(`Período: ${rotuloPeriodo()}. Gerado em ${new Date().toLocaleString('pt-BR')}.`, 14, y); y += 8;
  [['Total gasto', fmtPdf(a.total)], ['Compras', String(a.n)], ['Média por compra', fmtPdf(a.n ? a.total / a.n : 0)], ['Itens comprados', String(a.itens)]].forEach((c, i) => {
    const x = 14 + i * 46; doc.setFillColor(237, 241, 238); doc.roundedRect(x, y, 43, 19, 2, 2, 'F');
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...CINZA); doc.text(c[0], x + 3, y + 6);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...TINTA); doc.text(c[1], x + 3, y + 14);
  });
  y += 28;
  if (compras.length) {
    titulo('Gasto por mês');
    const meses = mesesDoPeriodo(compras); const vals = meses.map(k => a.porMes.get(k) || 0); const max = Math.max(...vals, 1);
    novaPagina(52); const base = y + 40, larg = 182 / meses.length;
    meses.forEach((k, i) => {
      const hgt = vals[i] / max * 32; const w = Math.min(larg * 0.66, 14); const x = 14 + i * larg + (larg - w) / 2;
      if (vals[i] > 0) { doc.setFillColor(...VERDE); doc.rect(x, base - hgt, w, hgt, 'F'); doc.setFontSize(7); doc.setTextColor(...TINTA); doc.text(curto(vals[i]), x + w / 2, base - hgt - 1.5, {align: 'center'}); }
      doc.setFontSize(7); doc.setTextColor(...CINZA); doc.text(mesNome(k), x + w / 2, base + 4, {align: 'center'});
    });
    y = base + 11;
    titulo('Por categoria');
    tabela(['Categoria', 'Gasto', '% do total'], [...a.porCat].sort((p, q) => q[1] - p[1]).map(([cid, v]) => [(cid ? categoria(cid) : SEM_CAT).nome, fmtPdf(v), Math.round(v / a.total * 100) + '%']), [1, 2]);
    titulo('Mercados');
    tabela(['Mercado', 'Compras', 'Total', 'Média por compra'], [...a.porMercado.values()].sort((p, q) => q.total - p.total).map(m => [m.nome, String(m.compras), fmtPdf(m.total), fmtPdf(m.total / m.compras)]), [1, 2, 3]);
    if (a.comparacao.length) { titulo('Mesmo produto, mercados diferentes'); tabela(['Produto', 'Mais barato', 'Mais caro', 'Diferença'], a.comparacao.slice(0, 15).map(c => [c.nome, `${c.medias[0].mercado} ${fmtPdf(c.medias[0].media)}`, `${c.medias[c.medias.length - 1].mercado} ${fmtPdf(c.medias[c.medias.length - 1].media)}`, Math.round(c.dif) + '%']), [3]); }
    titulo('Mais comprados');
    tabela(['Produto', 'Vezes', 'Quantidade', 'Gasto'], [...a.porProd.values()].sort((p, q) => q.vezes - p.vezes || q.gasto - p.gasto).slice(0, 20).map(p => [p.nome, String(p.vezes), fmtQtd(p.qtd, p.un), fmtPdf(p.gasto)]), [1, 2, 3]);
    titulo('Histórico de compras');
    tabela(['Data', 'Mercado', 'Itens', 'Total'], compras.map(c => [fmtData(c.finalizadaEm), c.mercado || 'Sem mercado', String(c.itens.length), fmtPdf(c.total ?? totais(c).gasto)]), [2, 3]);
  }
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(...CINZA); doc.text(`Compras da casa ${VERSAO}   Página ${i} de ${n}`, 196, 290, {align: 'right'}); }
  esconderToast();
  await baixar(`relatorio-compras-${dataArquivo()}.pdf`, doc.output('blob'));
}

/** Restaura backup validando a estrutura e os campos permitidos. */
async function restaurarBackup(arq){
  if (!arq) return;
  let o; try { o = JSON.parse(await arq.text()); } catch { return toast('Arquivo inválido.'); }
  if (!o || typeof o !== 'object' || !Array.isArray(o.produtos) || !Array.isArray(o.compras)) return toast('Este arquivo não é um backup do app.');
  const str = (v, m) => typeof v === 'string' ? v.slice(0, m) : '';
  const produtos = o.produtos.filter(p => p && typeof p.id === 'string' && /^[\w-]{1,60}$/.test(p.id) && typeof p.nome === 'string').map(p => ({
    id: p.id, nome: str(p.nome, 60), marca: str(p.marca, 40), tamanho: str(p.tamanho, 20), unidade: p.unidade === 'kg' ? 'kg' : 'un',
    categoriaId: typeof p.categoriaId === 'string' ? p.categoriaId.slice(0, 60) : null, codigo: /^\d{8,14}$/.test(p.codigo || '') ? p.codigo : '',
    fotoId: /^[0-9a-f]{32}$/.test(p.fotoId || '') ? p.fotoId : null, fotoData: typeof p.fotoData === 'string' && /^data:image\/(jpeg|png|webp);base64,/.test(p.fotoData) && p.fotoData.length < 200000 ? p.fotoData : null,
    criadoEm: Number(p.criadoEm) || Date.now(), ...(MEDIDAS[p.medida] ? {medida: p.medida} : {}),
    comparacoes: Array.isArray(p.comparacoes) ? p.comparacoes.slice(-40).filter(r => r && Number(r.unit) > 0 && MEDIDAS[r.medida]).map(r => ({em: Number(r.em) || 0, lugar: str(r.lugar, 40), medida: r.medida, marca: str(r.marca, 40), preco: Number(r.preco) || 0, qtdEmb: Number(r.qtdEmb) || 1, tam: Number(r.tam) || 0, sub: str(r.sub, 10), promo: str(r.promo, 10), unit: Number(r.unit)})) : []}));
  const temAberta = !!compraAberta();
  const item = it => ({pid: str(it.pid, 60), nome: str(it.nome, 60), marca: str(it.marca, 40), categoriaId: typeof it.categoriaId === 'string' ? it.categoriaId.slice(0, 60) : null, unidade: it.unidade === 'kg' ? 'kg' : 'un', qtd: Number(it.qtd) > 0 ? Number(it.qtd) : null, preco: Number(it.preco) > 0 ? Number(it.preco) : null, comprado: !!it.comprado, obs: str(it.obs, 80) || null, sugestao: str(it.sugestao, 40) || null, local: str(it.local, 40) || null, marcaCompra: str(it.marcaCompra, 40) || null, ...(it.compradoEm ? {compradoEm: Number(it.compradoEm)} : {})});
  const compras = o.compras.filter(c => c && typeof c.id === 'string' && /^[\w-]{1,60}$/.test(c.id) && Array.isArray(c.itens) && (c.status === 'finalizada' || (c.status === 'aberta' && !temAberta))).map(c => ({
    id: c.id, status: c.status, mercado: str(c.mercado, 40), orcamento: Number(c.orcamento) > 0 ? Number(c.orcamento) : null, criadaEm: Number(c.criadaEm) || Date.now(),
    ...(c.status === 'finalizada' ? {finalizadaEm: Number(c.finalizadaEm) || Date.now(), total: Number(c.total) || 0} : {}), itens: c.itens.filter(it => it && typeof it.pid === 'string').map(item)}));
  if (!(await confirmar(`Importar ${produtos.length} produtos e ${compras.length} compras? Itens com o mesmo identificador serão substituídos.`, 'Importar'))) return;
  toast('Importando…', null, 60000);
  try {
    await Dados.importar(produtos, compras);
    if (o.cfg && Array.isArray(o.cfg.categorias)) Dados.salvarCfg(c => {
      for (const k of o.cfg.categorias) if (k && typeof k.id === 'string' && typeof k.nome === 'string' && !c.categorias.some(x => x.id === k.id)) c.categorias.push({id: k.id.slice(0, 60), nome: k.nome.slice(0, 30), cor: /^#[0-9a-fA-F]{6}$/.test(k.cor) ? k.cor : CORES[0]});
      if (Array.isArray(o.cfg.mercados)) for (const m of o.cfg.mercados) if (typeof m === 'string' && !c.mercados.includes(m.slice(0, 40))) c.mercados.push(m.slice(0, 40));
    });
    esconderToast(); toast('Backup importado');
  } catch (e) { esconderToast(); falhaGravacao(e); }
}

  'exp-xlsx'(){ exportarXLSX(); },
  // ajustes
  'cat-cor'(b){ Dados.salvarCfg(c => { const k = c.categorias.find(x => x.id === b.dataset.id); if (k) k.cor = CORES[(CORES.indexOf(k.cor) + 1) % CORES.length]; }); },
  'cat-add'(){
    const i = $('#novaCat'); const nome = (i.value || '').trim().slice(0, 30); if (!nome) return toast('Informe o nome da categoria.');
    if (Dados.cfg.categorias.some(x => norm(x.nome) === norm(nome))) return toast('Essa categoria já existe.');
    Dados.salvarCfg(c => c.categorias.push({id: 'c' + novoId(), nome, cor: CORES[c.categorias.length % CORES.length]})); toast('Categoria criada');
  },
  async 'cat-excluir'(b){
    const k = Dados.cfg.categorias.find(x => x.id === b.dataset.id); if (!k) return;
    const n = [...Dados.produtos.values()].filter(p => p.categoriaId === k.id).length;
    if (!(await confirmar(`Excluir a categoria "${k.nome}"?` + (n ? ` ${n} ${n === 1 ? 'produto ficará' : 'produtos ficarão'} sem categoria.` : ''), 'Excluir', true))) return;
    Dados.salvarCfg(c => { c.categorias = c.categorias.filter(x => x.id !== k.id); });
    if (UI.filtroCat === k.id) UI.filtroCat = ''; if (UI.catProdutos === k.id) UI.catProdutos = ''; salvarUI();
  },
  async 'mer-excluir'(b){ if (await confirmar(`Remover "${b.dataset.v}" da lista de mercados? O histórico não muda.`, 'Remover')) Dados.salvarCfg(c => { c.mercados = c.mercados.filter(m => m !== b.dataset.v); }); },
  async backup(){
    const dados = {app: 'compras-da-casa', versao: VERSAO, geradoEm: new Date().toISOString(), produtos: [...Dados.produtos.values()], compras: [...Dados.compras.values()], cfg: Dados.cfg};
    await baixar(`compras-backup-${dataArquivo()}.json`, new Blob([JSON.stringify(dados)], {type: 'application/json'}));
  },
  restaurar(el, arq){ restaurarBackup(arq); },
  'limpar-log'(){ Dados.salvarCfg(c => { c.logSeg = []; }); },
  async 'ia-chave'(b){
    const p = b.dataset.p; if (!NOME_IA[p]) return;
    const origem = p === 'gemini' ? 'Google AI Studio' : 'console da Anthropic';
    const t = await perguntar('Chave do ' + NOME_IA[p], '', {placeholder: 'Cole a chave do ' + origem, ok: 'Testar e salvar'});
    if (t === null) return;
    const chave = t.trim();
    if (!(p === 'gemini' ? /^[\w-]{20,100}$/ : /^sk-ant-[\w-]{20,200}$/).test(chave)) return toast(`Isso não parece uma chave do ${NOME_IA[p]}. Copie de novo no ${origem}.`);
    const guardar = async modelo => { IA[p] = p === 'gemini' ? {chave, modelo} : {chave}; if (!IA.preferida) IA.preferida = p; await IA.gravar(); };
    toast('Testando a chave…', null, 15000);
    try { const modelo = await testarChaveIA(p, chave); await guardar(modelo); toast('Chave testada e salva. Modelo: ' + modelo, null, 5000); }
    catch (e) {
      if (e && e.codigo === 'rede') { await guardar(''); toast('Chave salva, mas não deu para testar agora (sem conexão).', null, 5000); }
      else toast((e && e.message) || 'Não foi possível testar a chave.', null, 6000);
    }
    render();
  },
  async 'ia-testar'(b){
    const p = b.dataset.p; if (!NOME_IA[p] || !IA[p].chave) return;
    toast('Testando a chave…', null, 15000);
    try { const modelo = await testarChaveIA(p, IA[p].chave); if (p === 'gemini') { IA.gemini.modelo = modelo; await IA.gravar(); } toast('Chave funcionando. Modelo: ' + modelo, null, 5000); }
    catch (e) { toast((e && e.message) || 'Não foi possível testar a chave.', null, 6000); }
    render();
  },
  async 'ia-remover'(b){
    const p = b.dataset.p; if (!NOME_IA[p]) return;
    if (!(await confirmar(`Remover a chave do ${NOME_IA[p]} deste aparelho?`, 'Remover', true))) return;
    IA[p] = p === 'gemini' ? {chave: '', modelo: ''} : {chave: ''};
    if (IA.preferida === p) IA.preferida = '';
    await IA.gravar(); toast('Chave removida'); render();
  },
  async 'ia-preferida'(b){ if (NOME_IA[b.dataset.v]) { IA.preferida = b.dataset.v; await IA.gravar(); render(); } },
};
/** Alterações de campos (chaves e textos dos ajustes). */
const ALTERACOES = {
  ocultar(i){ UI.ocultarComprados = i.checked; salvarUI(); render(); },
  'modo-mercado'(i){ UI.modoMercado = i.checked; salvarUI(); render(); },
  'cat-nome'(i){ const nome = i.value.trim().slice(0, 30); if (!nome) { render(); return toast('O nome não pode ficar vazio.'); } Dados.salvarCfg(c => { const k = c.categorias.find(x => x.id === i.dataset.id); if (k) k.nome = nome; }); },
  alerta(i){ const v = Math.round(parseNum(i.value)); if (!(v >= 1 && v <= 200)) { render(); return toast('Use um valor entre 1% e 200%.'); } Dados.salvarCfg(c => { c.alertaPct = v; }); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a; const s = topoSheet();
  if (s && el.closest('#sheet-root') && s.acoes && s.acoes[a]) { e.preventDefault(); s.acoes[a](el, e); return; }
  if (ACOES[a]) { e.preventDefault(); ACOES[a](el, e); }
});
document.addEventListener('change', e => {
  // botões de arquivo: entrega o arquivo à ação da folha ou da tela
  const inp = e.target.closest('input[data-arq]');
  if (inp) {
    pararVigia();
    const arq = inp.files && inp.files[0]; const a = inp.dataset.arq; inp.value = '';
    if (!arq) return;
    const s = topoSheet();
    if (s && inp.closest('#sheet-root') && s.acoes && s.acoes[a]) s.acoes[a](inp, arq);
    else if (ACOES[a]) ACOES[a](inp, arq);
    return;
  }
  const el = e.target.closest('[data-ch]'); if (el && ALTERACOES[el.dataset.ch]) ALTERACOES[el.dataset.ch](el);
});
document.addEventListener('click', e => { if (e.target.closest('[data-arq-label]')) vigiarSeletor(); }, true);
document.addEventListener('input', e => {
  if (e.target.id === 'buscaLista') { buscaLista = e.target.value; render(); }
  else if (e.target.id === 'buscaProdutos') { buscaProdutos = e.target.value; render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#modal-root').classList.contains('on')) return; if (topoSheet()) fecharSheet(); } });
let _scrollT = null;
window.addEventListener('scroll', () => { clearTimeout(_scrollT); _scrollT = setTimeout(salvarScroll, 200); }, {passive: true});

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
/** Estado do armazenamento do aparelho (exibido em Ajustes). */
const armazenamento = {persistente: false, uso: ''};
let _promptInstalar = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _promptInstalar = e; if (UI.tab === 'ajustes') render(); });
/** Bloco de instalação na tela inicial. */
function instalarHTML(){
  const instalado = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  if (instalado) return '';
  return `<h2 class="secao-titulo">Instalar na tela inicial</h2><section class="cartao"><div class="sub" style="margin:0 0 10px">O app abre como aplicativo, em tela cheia e sem internet.</div>${_promptInstalar ? '<button class="btn pri" data-a="instalar">Instalar app</button>' : '<div class="contagem" style="margin:0">No Chrome, toque nos três pontos e escolha Adicionar à tela inicial.</div>'}</section>`;
}
/** Pede ao navegador para não apagar os dados e mede o espaço usado. */
async function protegerArmazenamento(){
  try { if (navigator.storage && navigator.storage.persist) armazenamento.persistente = await navigator.storage.persisted() || await navigator.storage.persist(); } catch {}
  try { if (navigator.storage && navigator.storage.estimate) { const e = await navigator.storage.estimate(); armazenamento.uso = ((e.usage || 0) / 1048576).toLocaleString('pt-BR', {maximumFractionDigits: 1}) + ' MB'; } } catch {}
}
/** Primeira abertura: carrega a lista inicial combinada (uma única vez). */
async function aplicarSemente(){
  try { if (localStorage.getItem('compras.semente') === '1') return; } catch {}
  if (typeof SEMENTE === 'undefined') return;
  for (const p of SEMENTE.produtos) await Dados.gravarProduto(Object.assign({}, p, {criadoEm: Date.now(), atualizadoEm: Date.now()}));
  const c = Object.assign({}, SEMENTE.compra, {criadaEm: Date.now()}); Dados.compras.set(c.id, c); await BD.gravar('compras', c.id, c);
  Dados.salvarCfg(x => { for (const m of SEMENTE.mercados) if (!x.mercados.includes(m)) x.mercados.push(m); });
  try { localStorage.setItem('compras.semente', '1'); } catch {}
}
/** Registra o service worker e avisa quando houver versão nova. */
function registrarSW(){
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(reg => {
    const avisar = w => toast('Nova versão disponível', {rotulo: 'Atualizar', fn: () => w.postMessage('atualizar')}, 15000);
    if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
    reg.addEventListener('updatefound', () => { const w = reg.installing; w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisar(w); }); });
  }).catch(() => {});
  let recarregou = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (recarregou) return; recarregou = true; location.reload(); });
}
async function iniciar(){
  carregarUI();
  $('#versao').textContent = VERSAO;
  try {
    const r = await Dados.iniciar();
    if (r.vazio) await aplicarSemente();
    await IA.carregar();
  } catch {
    $('#view').innerHTML = '<div class="vazio"><strong>Não foi possível abrir o banco do aparelho</strong>Feche e abra o app de novo. Se continuar, verifique se o Chrome não está em modo anônimo.</div>';
    return;
  }
  render();
  requestAnimationFrame(() => window.scrollTo(0, lerScroll()));
  registrarSW();
  protegerArmazenamento().then(() => { if (UI.tab === 'ajustes') render(); });
}
iniciar();
</script>
